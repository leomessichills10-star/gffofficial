<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0A1322">
<title>Gardens Football Federation — Official Match Records</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Instrument+Sans:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   GFF — "Night court" design system
   A 5-a-side futsal court after dark: night navy page, court-blue
   paint, chalk-white lines, an orange ball. One drawn court is the
   signature; everything else stays flat and quiet.
========================================================= */
:root{
  --night:#0A1322;
  --night-2:#0E1B31;
  --court:#112340;
  --court-2:#183057;
  --court-3:#21406F;
  --pitch:#1B55AB;
  --pitch-deep:#133F84;

  --chalk:#EDF1F7;
  --chalk-2:#C6D1E2;
  --muted:#93A5C0;
  --faint:#5F7394;
  --line:rgba(237,241,247,.13);
  --line-2:rgba(237,241,247,.24);

  --ball:#FF7B2E;
  --ball-hi:#FF9456;
  --ball-dim:#D95F17;
  --ball-soft:rgba(255,123,46,.15);
  --yellow:#F5C830;
  --red:#F0524F;
  --green:#3DDC97;
  --sky:#7CB2FF;

  --gold:#F2C14E;
  --silver:#D5DCE6;
  --bronze:#E09A63;
  --icon:#9BE7FF;

  --display:'Big Shoulders Display','Arial Narrow','Roboto Condensed',sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;

  --max:1200px;

  /* compatibility aliases for a few older inline style fragments */
  --surface:var(--court); --surface2:var(--court-2); --bg:var(--night);
  --amber:var(--ball); --turf:var(--ball); --mono:var(--body); --head:var(--body);
  --muted-dim:var(--faint); --ice:var(--green); --violet:var(--sky); --blue:var(--sky); --crimson:var(--red);
}

*{ box-sizing:border-box; margin:0; padding:0; }
html{ scroll-behavior:smooth; }
body{
  min-height:100vh; display:flex; flex-direction:column;
  background:
    radial-gradient(1100px 520px at 78% -8%, rgba(34,92,190,.30), transparent 62%),
    radial-gradient(800px 420px at -5% 30%, rgba(22,60,130,.18), transparent 60%),
    var(--night);
  background-repeat:no-repeat;
  color:var(--chalk); font:400 15px/1.55 var(--body);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
::selection{ background:var(--ball); color:#1A0E05; }
button{ font:inherit; color:inherit; cursor:pointer; }
a{ color:inherit; }
:focus-visible{ outline:2px solid var(--ball); outline-offset:3px; border-radius:6px; }
.hidden{ display:none !important; }
.wrap{ width:100%; max-width:var(--max); margin:0 auto; padding:0 24px; }
#app{ flex:1; width:100%; max-width:var(--max); margin:0 auto; padding:0 24px 80px; }

/* ---------- Top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:50;
  background:rgba(10,19,34,.84); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar-in{ max-width:var(--max); margin:0 auto; padding:0 24px; min-height:64px; display:flex; align-items:center; gap:26px; }
.brand{ display:flex; align-items:center; gap:12px; background:none; border:0; text-align:left; }
.brand-mark{ width:38px; height:38px; flex-shrink:0; filter:drop-shadow(0 2px 4px rgba(0,0,0,.45)); }
.brand-name{ display:block; font:800 19px/1 var(--display); letter-spacing:.05em; text-transform:uppercase; }
.brand-sub{ display:block; font-size:11.5px; color:var(--muted); margin-top:3px; }
.mainnav{ display:flex; align-items:center; gap:2px; flex:1; }
.navbtn{
  position:relative; background:none; border:0; padding:9px 14px; border-radius:8px;
  font-weight:500; color:var(--muted); transition:color .15s, background .15s;
}
.navbtn:hover{ color:var(--chalk); background:rgba(237,241,247,.06); }
.navbtn.active{ color:var(--chalk); }
.navbtn.active::after{ content:""; position:absolute; left:14px; right:14px; bottom:-11px; height:2px; background:var(--ball); border-radius:2px; }
.navgroup{ position:relative; }
.navgroup .caret{ font-size:10px; margin-left:3px; opacity:.7; }
.dropdown{
  display:none; position:absolute; top:calc(100% + 10px); left:0; min-width:230px; padding:6px;
  background:var(--court); border:1px solid var(--line-2); border-radius:14px; box-shadow:0 24px 50px -12px rgba(0,0,0,.65);
}
.dropdown::before{ content:""; position:absolute; left:0; right:0; top:-12px; height:12px; }
.navgroup:hover .dropdown, .navgroup.open .dropdown{ display:block; }
.dropdown button{ display:flex; align-items:center; gap:10px; width:100%; padding:10px 12px; border-radius:9px; background:none; border:0; text-align:left; color:var(--chalk-2); cursor:pointer; font-size:14px; }
.dropdown button:hover{ background:var(--court-2); color:var(--chalk); }
.nav-ic{ display:inline-flex; color:var(--ball); }
.card-chip{ display:inline-block; width:10px; height:14px; border-radius:2px; vertical-align:-2px; }
.card-chip.y{ background:var(--yellow); }
.card-chip.r{ background:var(--red); }
.topbar-right{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
.admin-chip{ display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--chalk-2); padding:0 6px; }
.admin-chip .dot{ width:8px; height:8px; border-radius:50%; background:var(--green); box-shadow:0 0 0 3px rgba(61,220,151,.18); }

/* ---------- Buttons & chips ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:10px 18px; border-radius:10px; border:1px solid var(--line-2); background:transparent;
  color:var(--chalk); font-weight:600; font-size:14px; line-height:1.1; white-space:nowrap;
  transition:background .15s, border-color .15s, transform .15s;
}
.btn:hover{ background:rgba(237,241,247,.07); border-color:rgba(237,241,247,.45); }
.btn:active{ transform:translateY(1px); }
.btn.primary{ background:var(--ball); border-color:var(--ball); color:#1A0E05; }
.btn.primary:hover{ background:var(--ball-hi); border-color:var(--ball-hi); }
.btn.small{ padding:7px 13px; font-size:13px; border-radius:9px; }
.btn.danger{ border-color:rgba(240,82,79,.45); color:var(--red); }
.btn.danger:hover{ background:rgba(240,82,79,.1); border-color:var(--red); }
.textlink{ background:none; border:0; color:var(--chalk); font-weight:600; font-size:14px; text-decoration:underline; text-decoration-color:var(--ball); text-underline-offset:5px; text-decoration-thickness:2px; padding:4px 0; }
.textlink:hover{ color:var(--ball-hi); }

.seg{ display:flex; flex-wrap:wrap; gap:6px; }
.seg button{
  padding:8px 15px; border-radius:999px; border:1px solid var(--line); background:transparent;
  color:var(--muted); font-weight:500; font-size:13.5px; transition:.15s;
}
.seg button:hover{ color:var(--chalk); border-color:var(--line-2); }
.seg button.on{ background:var(--chalk); color:var(--night); border-color:var(--chalk); font-weight:600; }
.seg.sm button{ padding:6px 12px; font-size:12.5px; }
.seg.sm button.on{ background:var(--ball); border-color:var(--ball); color:#1A0E05; }
.season-tabs{ margin:6px 0 4px; }

.kit{ display:inline-block; width:11px; height:11px; border-radius:50%; flex-shrink:0; }
.kit.k1{ background:var(--ball); }
.kit.k2{ background:var(--chalk); }
.chip{
  display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:999px; font-size:11.5px; font-weight:600;
  background:rgba(237,241,247,.08); color:var(--chalk-2);
}
.chip.warn{ background:rgba(245,200,48,.14); color:var(--yellow); }
.chip.bad{ background:rgba(240,82,79,.14); color:var(--red); }
.chip.good{ background:rgba(61,220,151,.14); color:var(--green); }
.chip.sky{ background:rgba(124,178,255,.15); color:var(--sky); }

/* ---------- Page scaffolding ---------- */
.crumbs{ padding:26px 0 0; font-size:13px; color:var(--muted); }
.crumbs span{ cursor:pointer; color:var(--chalk-2); }
.crumbs span:hover{ color:var(--ball-hi); text-decoration:underline; text-underline-offset:3px; }
.page-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap; padding:18px 0 30px; }
.page-head h1{ font:900 clamp(44px,6.4vw,76px)/.92 var(--display); text-transform:uppercase; letter-spacing:-.005em; }
.page-head .desc{ color:var(--muted); max-width:62ch; margin-top:12px; }
.sec-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin:0 0 22px; }
.sec-head h2, .h2{ font:800 clamp(30px,3.6vw,42px)/1 var(--display); text-transform:uppercase; letter-spacing:.005em; display:flex; align-items:center; gap:10px; }
.h2 svg, .sec-head h2 svg{ color:var(--ball); }
.sec{ padding:56px 0 8px; }
.empty-state{
  text-align:center; padding:54px 24px; border:1px dashed var(--line-2); border-radius:18px; color:var(--muted); max-width:640px; margin:30px auto;
}
.empty-state .ic{ color:var(--ball); margin-bottom:12px; display:flex; justify-content:center; }
.empty-state b{ display:block; color:var(--chalk); font:800 26px/1.1 var(--display); text-transform:uppercase; margin-bottom:8px; }
.notice{ max-width:560px; margin:90px auto; padding:30px; background:var(--court); border:1px solid var(--line-2); border-radius:18px; text-align:center; }
.notice h2{ font:800 30px/1.1 var(--display); text-transform:uppercase; color:var(--red); margin-bottom:10px; }
.notice p{ color:var(--muted); }
.loading{ display:flex; flex-direction:column; align-items:center; gap:16px; padding:140px 0; color:var(--muted); }
.spin{ width:16px; height:16px; border-radius:50%; border:2px solid rgba(237,241,247,.2); border-top-color:var(--ball); animation:spin .7s linear infinite; display:inline-block; }
.loading .spin{ width:28px; height:28px; border-width:3px; }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ---------- Home hero ---------- */
.hero{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.18fr); gap:56px; align-items:center; padding:60px 0 28px; }
.hero h1{ font:900 clamp(58px,8.6vw,116px)/.86 var(--display); text-transform:uppercase; letter-spacing:-.01em; }
.hero .lede{ color:var(--chalk-2); font-size:17px; line-height:1.6; max-width:46ch; margin:26px 0 30px; }
.hero-cta{ display:flex; gap:12px; flex-wrap:wrap; }
.facts{ display:flex; gap:30px; flex-wrap:wrap; margin-top:38px; padding-top:24px; border-top:1px solid var(--line); }
.facts div{ display:flex; align-items:baseline; gap:8px; }
.facts b{ font:800 38px/1 var(--display); }
.facts span{ color:var(--muted); font-size:14px; }
.lic{ display:inline-flex; align-items:center; gap:8px; margin-top:22px; font-size:13px; color:var(--muted); background:none; border:0; padding:0; }
.lic:hover{ color:var(--chalk); }
.lic svg{ color:var(--green); }

/* ---------- The court (signature) ---------- */
.court-panel{
  background:var(--pitch); border-radius:24px; overflow:hidden; position:relative;
  box-shadow:0 40px 90px -40px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.1);
}
.court-panel.link{ cursor:pointer; }
.court-top{ display:flex; align-items:center; justify-content:space-between; padding:12px 18px; background:var(--pitch-deep); font-size:13px; color:#CFE0FA; }
.court-top .tag{ display:inline-flex; align-items:center; gap:8px; font-weight:600; color:#fff; }
.court-top .tag::before{ content:""; width:8px; height:8px; border-radius:50%; background:var(--ball); }
.court-foot{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:12px 18px; background:var(--pitch-deep); font-size:13px; color:#CFE0FA; }
.court-foot b{ color:#fff; }
.court-foot .sp{ flex:1; }
.court{ position:relative; }
.court svg{ display:block; width:100%; height:auto; }
.court .court-v{ display:none; }
.disc{ cursor:pointer; outline:none; }
.court .dn{ font:600 11px var(--body); fill:#fff; paint-order:stroke; stroke:rgba(8,17,31,.6); stroke-width:3px; stroke-linejoin:round; }
.disc .dc{ transform-box:fill-box; transform-origin:center; transition:transform .18s; }
.disc:hover .dc, .disc:focus-visible .dc{ transform:scale(1.14); }
.disc:focus-visible .ring{ stroke:#fff; stroke-width:3; }
.court-empty{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px; padding:20px; }
.court-empty b{ font:800 30px/1 var(--display); text-transform:uppercase; color:#fff; }
.court-empty span{ color:#CFE0FA; max-width:32ch; }

.board{
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:18px; padding:18px 22px;
  background:#08111F;
}
.board-team{ display:flex; align-items:center; gap:10px; justify-content:flex-end; min-width:0; }
.board-team.right{ justify-content:flex-start; }
.board-name{ font:700 22px/1.05 var(--display); text-transform:uppercase; letter-spacing:.03em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.board-score{ display:flex; align-items:center; gap:10px; font-family:var(--display); }
.board-score b{ font-weight:900; font-size:68px; line-height:.9; min-width:.7em; text-align:center; font-variant-numeric:tabular-nums; }
.board-score i{ font-style:normal; font-weight:700; font-size:34px; color:var(--faint); transform:translateY(-4px); }
.board-score b.win, .board-score b.draw{ color:var(--chalk); }
.board-score b.lose{ color:var(--faint); }
.board.big{ padding:26px 30px; }
.board.big .board-name{ font-size:32px; }
.board.big .board-score b{ font-size:112px; }
.board.big .board-score i{ font-size:52px; }

/* ---------- Fixture cards ---------- */
.fx-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(420px,1fr)); gap:14px; }
.fx{
  background:var(--court); border:1px solid var(--line); border-radius:16px; padding:16px 18px 14px; cursor:pointer;
  transition:border-color .15s, background .15s, transform .15s;
}
.fx:hover{ border-color:var(--line-2); background:var(--court-2); transform:translateY(-2px); }
.fx-meta{ display:flex; align-items:center; justify-content:space-between; font-size:12.5px; color:var(--muted); margin-bottom:12px; }
.fx-main{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:14px; }
.fx-team{ display:flex; align-items:center; gap:9px; justify-content:flex-end; font:700 20px/1.05 var(--display); text-transform:uppercase; letter-spacing:.03em; min-width:0; }
.fx-team.right{ justify-content:flex-start; }
.fx-team .nm{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.fx-score{ display:flex; align-items:center; gap:8px; font-family:var(--display); font-weight:900; font-size:44px; line-height:1; background:var(--night); border-radius:10px; padding:4px 14px 2px; }
.fx-score u{ text-decoration:none; font-size:22px; color:var(--faint); font-weight:700; }
.fx-score .lose{ color:var(--faint); }
.fx-foot{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:13px; padding-top:11px; border-top:1px solid var(--line); font-size:13px; color:var(--muted); }
.fx-foot b{ color:var(--chalk); font-weight:600; }
.day{ margin-bottom:34px; }
.day-h{ font:700 18px/1 var(--display); letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:14px; display:flex; align-items:center; gap:14px; }
.day-h::after{ content:""; flex:1; height:1px; background:var(--line); }

/* ---------- Player cards ---------- */
.roster-directory{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:26px 20px; }
.pc-slot{ filter:drop-shadow(0 16px 22px rgba(0,0,0,.4)); }
.pcard{
  --t1:#3B2417; --t2:#1B1009; --ta:var(--bronze);
  position:relative; cursor:pointer; padding:2px;
  background:linear-gradient(160deg, var(--ta), rgba(255,255,255,.05) 55%, var(--ta));
  clip-path:polygon(0 0, calc(100% - 26px) 0, 100% 26px, 100% 100%, 0 100%);
  transition:transform .2s;
}
.pc-slot:hover .pcard{ transform:translateY(-5px); }
.pcard.t-silver{ --t1:#2F394B; --t2:#141A25; --ta:var(--silver); }
.pcard.t-gold{ --t1:#5A4510; --t2:#241A06; --ta:var(--gold); }
.pcard.t-icon{ --t1:#1D4F86; --t2:#2A1B5E; --ta:var(--icon); }
.pc-frame{
  position:relative; overflow:hidden; aspect-ratio:5/7; display:flex; flex-direction:column; padding:16px 16px 14px;
  background:linear-gradient(165deg, var(--t1), var(--t2) 80%);
  clip-path:polygon(0 0, calc(100% - 25px) 0, 100% 25px, 100% 100%, 0 100%);
}
.pc-frame::before{
  content:""; position:absolute; left:50%; top:46%; width:150%; aspect-ratio:1; transform:translate(-50%,-50%);
  border:1.5px solid rgba(255,255,255,.09); border-radius:50%; pointer-events:none;
}
.pc-frame::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(112deg, transparent 32%, rgba(255,255,255,.17) 47%, transparent 62%);
  transform:translateX(-120%); transition:transform .7s ease;
}
.pc-slot:hover .pc-frame::after{ transform:translateX(120%); }
.pcard.t-icon .pc-frame{ background:
  linear-gradient(165deg, rgba(155,231,255,.18), transparent 40%, rgba(190,150,255,.2)),
  linear-gradient(165deg, var(--t1), var(--t2) 80%); }
.pc-top{ display:flex; flex-direction:column; align-items:flex-start; line-height:1; position:relative; z-index:1; }
.pc-rate{ font:900 56px/.9 var(--display); color:var(--ta); display:flex; align-items:flex-start; gap:4px; }
.pc-rate .rating-badge{ font-size:14px; margin-top:4px; }
.pc-pos{ font:700 15px/1 var(--display); letter-spacing:.08em; color:var(--chalk); margin-top:8px; text-transform:uppercase; }
.pc-tier{ font-size:11px; color:var(--ta); opacity:.85; margin-top:5px; font-weight:600; }
.pc-mono{
  position:absolute; right:12px; top:40%; transform:translateY(-50%);
  font:900 clamp(70px,9vw,104px)/.8 var(--display); color:var(--ta); opacity:.22; letter-spacing:-.02em; pointer-events:none;
}
.pc-name{
  margin-top:auto; position:relative; z-index:1; text-align:center; padding:9px 0 10px; border-top:1px solid rgba(255,255,255,.18);
  font:800 22px/1.05 var(--display); text-transform:uppercase; letter-spacing:.03em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.pc-stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:2px; position:relative; z-index:1; text-align:center; }
.pc-stats div{ font-size:10.5px; color:var(--chalk-2); line-height:1.2; }
.pc-stats b{ display:block; font:800 22px/1 var(--display); color:var(--chalk); margin-bottom:3px; font-variant-numeric:tabular-nums; }
.pc-slot select{
  width:100%; margin-top:10px; background:var(--court); border:1px solid var(--line-2); color:var(--chalk); border-radius:9px; padding:8px 10px; font:inherit; font-size:13px;
}
.rating-badge.star{ color:var(--yellow); }
.rating-badge.icon{ color:var(--icon); }
.player-search{ margin-bottom:28px; }
.player-search input{
  width:100%; max-width:460px; background:var(--court); border:1px solid var(--line); border-radius:12px; padding:13px 16px; color:var(--chalk); font:inherit; outline:none; transition:.15s;
}
.player-search input:focus{ border-color:var(--ball); box-shadow:0 0 0 3px var(--ball-soft); }
.player-search input::placeholder{ color:var(--faint); }

/* ---------- Honours ---------- */
.honours{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.honour{ display:flex; gap:18px; align-items:center; padding:22px; background:var(--court); border:1px solid var(--line); border-radius:16px; }
.honour .tr{ width:42px; height:50px; flex-shrink:0; color:var(--gold); }
.honour .comp{ font-size:13px; color:var(--muted); }
.honour .team{ font:800 30px/1.05 var(--display); text-transform:uppercase; margin:3px 0 6px; }
.honour .times{ font-size:13px; color:var(--gold); font-weight:600; }

/* ---------- Match detail ---------- */
.match-panel{ margin:18px 0 26px; }
.match-note{ display:flex; gap:14px; align-items:center; padding:16px 20px; border-radius:14px; background:var(--court); border:1px solid var(--line); margin-bottom:12px; }
.match-note .ic{ width:40px; height:40px; border-radius:50%; display:grid; place-items:center; background:rgba(245,200,48,.14); color:var(--yellow); flex-shrink:0; }
.match-note.cs .ic{ background:rgba(61,220,151,.14); color:var(--green); }
.match-note .lbl{ font-size:12.5px; color:var(--muted); }
.match-note .nm{ font:800 24px/1.1 var(--display); text-transform:uppercase; letter-spacing:.02em; }
.team-tables{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:26px; }
.team-table-wrap{ background:var(--court); border:1px solid var(--line); border-radius:16px; overflow:hidden; overflow-x:auto; }
.tt-head{ display:flex; align-items:center; gap:10px; padding:16px 20px; font:800 24px/1 var(--display); text-transform:uppercase; letter-spacing:.03em; border-bottom:1px solid var(--line); }
.tt-head .chip{ margin-left:auto; font-family:var(--body); text-transform:none; letter-spacing:0; }
table.roster{ width:100%; border-collapse:collapse; }
table.roster th{ text-align:right; font-size:12px; font-weight:600; color:var(--muted); padding:10px 12px; }
table.roster th:first-child, table.roster td.pname{ text-align:left; padding-left:20px; }
table.roster td{ padding:12px; border-top:1px solid var(--line); text-align:right; font-variant-numeric:tabular-nums; }
table.roster td.pname{ font-weight:600; }
table.roster tbody tr{ cursor:pointer; transition:background .12s; }
table.roster tbody tr:hover{ background:var(--court-2); }
.sub-chip{ display:inline-block; font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:5px; margin-left:6px; background:rgba(124,178,255,.16); color:var(--sky); vertical-align:1px; }
.sub-chip.og{ background:rgba(240,82,79,.16); color:var(--red); }
.sub-chip.cs{ background:rgba(61,220,151,.16); color:var(--green); }

/* ---------- Player profile ---------- */
.profile{ display:grid; grid-template-columns:270px minmax(0,1fr); gap:52px; padding-top:26px; align-items:start; }
.profile-card{ position:sticky; top:96px; }
.profile-card .pc-mono{ font-size:100px; }
.profile h1{ font:900 clamp(48px,6.4vw,84px)/.9 var(--display); text-transform:uppercase; }
.profile .tags{ display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 0; }
.profile .pos-edit select{ margin-top:14px; background:var(--court); border:1px solid var(--line-2); color:var(--chalk); border-radius:9px; padding:9px 12px; font:inherit; font-size:13px; min-width:200px; }
.stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:16px; overflow:hidden; margin:16px 0 40px; }
.stat-grid div{ background:var(--night-2); padding:16px 18px 14px; }
.stat-grid b{ display:block; font:800 44px/1 var(--display); font-variant-numeric:tabular-nums; }
.stat-grid span{ font-size:12.5px; color:var(--muted); }
.bio{ display:grid; grid-template-columns:1fr 1fr; gap:0 44px; margin:14px 0 8px; }
.bio-row{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:13px 0; border-bottom:1px solid var(--line); min-height:52px; }
.bio-row dt{ color:var(--muted); font-size:14px; }
.bio-row dd{ font-weight:600; text-align:right; }
.bio-row dd.accent{ color:var(--ball-hi); }
.bio-row input{ background:var(--court); border:1px solid var(--line-2); color:var(--chalk); border-radius:8px; padding:7px 10px; font:inherit; font-size:14px; width:150px; text-align:right; color-scheme:dark; }
.bio-row input:focus{ outline:none; border-color:var(--ball); box-shadow:0 0 0 3px var(--ball-soft); }
.fine{ font-size:12.5px; color:var(--faint); margin:8px 0 0; max-width:70ch; }
.form-tip{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); margin:14px 0 4px; }
.form-tip svg{ color:var(--green); }
.subsec{ margin-top:46px; }
.trophy-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; margin-top:16px; }
.trophy-card{ text-align:center; padding:18px 12px 14px; border:1px dashed var(--line-2); border-radius:14px; color:var(--faint); }
.trophy-card.has{ border:1px solid rgba(242,193,78,.5); background:linear-gradient(180deg, rgba(242,193,78,.1), transparent); color:var(--chalk); }
.trophy-card .trophy-ic{ width:30px; height:34px; margin:0 auto 8px; color:var(--faint); }
.trophy-card.has .trophy-ic{ color:var(--gold); }
.trophy-name{ font-size:13px; min-height:36px; }
.trophy-count{ font:800 34px/1 var(--display); margin-top:4px; }
.trophy-controls{ display:flex; gap:8px; justify-content:center; margin-top:10px; }
.hl-list{ display:grid; gap:8px; margin-top:16px; }
.hl{ display:flex; align-items:center; gap:14px; padding:13px 16px; border:1px solid var(--line); border-radius:12px; background:var(--court); cursor:pointer; transition:.15s; }
.hl:hover{ border-color:var(--line-2); background:var(--court-2); }
.hl .ic{ color:var(--ball); display:flex; }
.hl .t{ font-weight:600; }
.hl .m{ font-size:13px; color:var(--muted); }
.history{ margin-top:16px; border-top:1px solid var(--line); }
.hist-row{ display:grid; grid-template-columns:110px 1fr auto; align-items:center; gap:16px; padding:14px 4px; border-bottom:1px solid var(--line); cursor:pointer; transition:background .12s; }
.hist-row:hover{ background:rgba(237,241,247,.04); }
.hist-row .h-date{ font-size:13px; color:var(--muted); }
.hist-row .h-score{ font-weight:600; display:flex; align-items:center; flex-wrap:wrap; }
.hist-row .h-score em{ font:800 20px/1 var(--display); font-style:normal; letter-spacing:.03em; margin:0 8px; }
.hist-row .h-stats{ display:flex; gap:12px; align-items:center; font-size:13.5px; color:var(--chalk-2); font-variant-numeric:tabular-nums; }
.hist-row .h-stats span{ display:inline-flex; align-items:center; gap:5px; }
.res{ display:inline-grid; place-items:center; width:24px; height:24px; border-radius:6px; font:800 14px/1 var(--display); margin-right:10px; }
.res.w{ background:rgba(61,220,151,.18); color:var(--green); }
.res.d{ background:rgba(237,241,247,.12); color:var(--chalk-2); }
.res.l{ background:rgba(240,82,79,.16); color:var(--red); }

/* ---------- Stats ---------- */
.leader{ text-align:right; }
.leader .nm{ font:800 24px/1 var(--display); text-transform:uppercase; letter-spacing:.03em; color:var(--chalk-2); }
.leader .v{ font:900 72px/.9 var(--display); color:var(--ball); font-variant-numeric:tabular-nums; }
.leader .u{ font-size:12.5px; color:var(--muted); }
.stat-filters{ display:grid; gap:12px; margin-bottom:26px; }
.lt-wrap{ border:1px solid var(--line); border-radius:16px; overflow-x:auto; background:var(--court); }
table.lt{ width:100%; border-collapse:separate; border-spacing:0; min-width:880px; }
table.lt th{
  position:sticky; top:0; text-align:right; font-size:12px; font-weight:600; color:var(--muted); padding:13px 12px; background:var(--night-2); white-space:nowrap; border-bottom:1px solid var(--line-2);
}
table.lt td{ padding:11px 12px; text-align:right; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; white-space:nowrap; }
table.lt tbody tr:last-child td{ border-bottom:0; }
table.lt tbody tr{ transition:background .12s; }
table.lt tbody tr:hover td{ background:rgba(237,241,247,.045); }
table.lt .c-rank{ width:56px; text-align:center; padding-left:14px; }
table.lt .c-player{ text-align:left; min-width:190px; }
table.lt th.c-player{ text-align:left; }
table.lt th.c-rank{ text-align:center; }
table.lt td.c-player{ font-weight:600; }
.pl{ display:flex; align-items:center; gap:12px; cursor:pointer; }
.pl:hover .pn{ color:var(--ball-hi); }
.pl .mono{ width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:var(--court-3); font:800 14px/1 var(--display); letter-spacing:.03em; flex-shrink:0; }
.pos-tag{ font:700 13px/1 var(--display); letter-spacing:.08em; color:var(--muted); }
.medal{ display:inline-grid; place-items:center; width:28px; height:28px; border-radius:50%; font:900 16px/1 var(--display); color:#1A0E05; }
.medal.m1{ background:linear-gradient(145deg,#FFE08A,#E0A92B); }
.medal.m2{ background:linear-gradient(145deg,#F3F6FA,#A9B4C4); }
.medal.m3{ background:linear-gradient(145deg,#F2B98A,#B8703A); }
table.lt td.act, table.lt th.act{ position:relative; color:var(--chalk); font-weight:700; }
table.lt th.act{ color:var(--ball-hi); }
table.lt td.act{ min-width:132px; }
table.lt td.act .bar{ position:absolute; top:9px; bottom:9px; right:0; width:var(--w); background:linear-gradient(270deg, rgba(255,123,46,.30), rgba(255,123,46,.04)); border-radius:6px 0 0 6px; }
table.lt td.act b{ position:relative; font:800 20px/1 var(--display); }
table.lt tr.top1 td{ background:rgba(255,123,46,.05); }
table.lt td.dim{ color:var(--muted); }
@media(max-width:820px){
  table.lt .c-rank, table.lt .c-player{ position:sticky; z-index:2; background:var(--court); }
  table.lt th.c-rank, table.lt th.c-player{ background:var(--night-2); z-index:3; }
  table.lt .c-rank{ left:0; }
  table.lt .c-player{ left:56px; box-shadow:6px 0 12px -8px rgba(0,0,0,.6); min-width:150px; }
  table.lt tr.top1 td.c-rank, table.lt tr.top1 td.c-player{ background:#18304D; }
}

/* ---------- Forms, modals ---------- */
.field{ margin-bottom:16px; }
.field label{ display:block; font-size:13px; font-weight:600; color:var(--chalk-2); margin-bottom:7px; }
.field input, .field select, .field textarea{
  width:100%; background:var(--night-2); border:1px solid var(--line-2); color:var(--chalk); border-radius:10px; padding:12px 14px; font:inherit; outline:none; transition:.15s; color-scheme:dark;
}
.field input:focus, .field select:focus{ border-color:var(--ball); box-shadow:0 0 0 3px var(--ball-soft); }
.field input:disabled{ opacity:.6; }
.err-text{ color:var(--red); font-size:13.5px; margin-top:8px; font-weight:500; }
.modal-backdrop{ position:fixed; inset:0; z-index:100; background:rgba(4,9,18,.72); backdrop-filter:blur(6px); display:grid; place-items:center; padding:20px; animation:fade .18s ease; }
.modal{ width:min(450px,100%); max-height:92vh; overflow:auto; background:var(--court); border:1px solid var(--line-2); border-radius:20px; padding:28px; box-shadow:0 40px 90px -20px rgba(0,0,0,.8); animation:rise .22s ease; }
.modal h3{ font:800 34px/1 var(--display); text-transform:uppercase; margin-bottom:10px; }
.modal p.hint{ color:var(--muted); font-size:14px; margin-bottom:22px; }
.modal-actions{ display:flex; gap:10px; margin-top:22px; }
.modal-actions .btn{ flex:1; }
@keyframes fade{ from{ opacity:0; } }
@keyframes rise{ from{ opacity:0; transform:translateY(10px) scale(.98); } }

.form-shell{ background:var(--court); border:1px solid var(--line); border-radius:20px; padding:28px; }
.form-toprow{ display:flex; gap:16px; flex-wrap:wrap; margin-bottom:24px; }
.form-toprow .field{ flex:1; min-width:200px; margin-bottom:0; }
.roster-columns{ display:grid; grid-template-columns:1fr 1fr; gap:26px; }
.roster-col-head{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.roster-col-head h3{ font:800 26px/1 var(--display); text-transform:uppercase; letter-spacing:.03em; display:flex; align-items:center; gap:10px; }
.roster-columns > div:nth-child(1) .roster-col-head h3::before, .roster-columns > div:nth-child(2) .roster-col-head h3::before{ content:""; width:12px; height:12px; border-radius:50%; }
.roster-columns > div:nth-child(1) .roster-col-head h3::before{ background:var(--ball); }
.roster-columns > div:nth-child(2) .roster-col-head h3::before{ background:var(--chalk); }
.player-row{
  display:grid; grid-template-columns:repeat(8,minmax(0,1fr)); gap:8px 7px; align-items:end;
  background:var(--night-2); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px;
}
.player-row input{
  width:100%; background:var(--court); border:1px solid var(--line); color:var(--chalk); border-radius:8px; padding:8px 7px; font:inherit; font-size:14px; outline:none; text-align:center; color-scheme:dark; font-variant-numeric:tabular-nums;
}
.player-row input.pname{ grid-column:1/-1; text-align:left; font-weight:600; padding:10px 12px; font-size:15px; }
.player-row input[type=number]{ -moz-appearance:textfield; appearance:textfield; }
.player-row input[type=number]::-webkit-inner-spin-button, .player-row input[type=number]::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }
.player-row input:focus{ border-color:var(--ball); box-shadow:0 0 0 3px var(--ball-soft); }
.player-row .mini-lbl{ display:block; font-size:11px; color:var(--muted); margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.suggest-slot{ margin:-4px 0 8px 4px; }
.suggest-line{ font-size:12.5px; color:var(--green); cursor:pointer; }
.suggest-line b{ text-decoration:underline; text-underline-offset:3px; }
.extra-goal-box, .cs-box, .subs-box{
  margin-top:12px; background:var(--night-2); border:1px solid var(--line); border-left:3px solid var(--ball); border-radius:12px; padding:14px 16px;
}
.cs-box{ border-left-color:var(--green); }
.subs-box{ border-left-color:var(--sky); }
.extra-goal-box{ display:flex; align-items:center; justify-content:space-between; gap:14px; }
.eg-label{ display:flex; align-items:center; gap:7px; font-weight:600; font-size:14px; }
.eg-hint{ font-size:12.5px; color:var(--muted); margin-top:3px; }
.eg-input-wrap{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
.extra-goal-box input, .subs-box input[data-role="sub-count"]{
  width:54px; text-align:center; background:var(--court); border:1px solid var(--line-2); color:var(--chalk); padding:8px 4px; border-radius:8px; font:inherit; font-weight:600; outline:none;
}
.eg-step{ width:34px; height:34px; border-radius:9px; border:1px solid var(--line-2); background:var(--court-2); color:var(--chalk); font-size:17px; line-height:1; }
.eg-step:hover{ border-color:var(--ball); }
.cs-toggle{ display:flex; align-items:center; gap:10px; font-weight:600; font-size:14px; cursor:pointer; }
.cs-toggle input{ width:17px; height:17px; accent-color:var(--green); }
.cs-players{ margin-top:12px; display:flex; flex-wrap:wrap; gap:8px; }
.cs-hint{ width:100%; font-size:12.5px; color:var(--muted); }
.cs-player-chip{ display:inline-flex; align-items:center; gap:7px; padding:6px 12px; border:1px solid var(--line-2); border-radius:999px; font-size:13px; cursor:pointer; background:var(--court); }
.cs-player-chip input{ accent-color:var(--green); }
.subs-box-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.subs-rows{ margin-top:12px; }
.subs-rows:empty{ margin-top:0; }
.form-tools{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin:24px 0 6px; }
.lb-meta{ font-size:13px; color:var(--muted); }
.motm-select-wrap{ margin-top:18px; max-width:420px; }
.form-final{ display:flex; justify-content:flex-end; gap:12px; margin-top:26px; padding-top:22px; border-top:1px solid var(--line); }

.history-list{ display:grid; gap:8px; }
.history-row{ display:flex; align-items:center; gap:14px; padding:14px 18px; background:var(--court); border:1px solid var(--line); border-radius:12px; flex-wrap:wrap; }
.hr-dot{ width:9px; height:9px; border-radius:50%; background:var(--green); box-shadow:0 0 0 3px rgba(61,220,151,.16); }
.hr-name{ font-weight:600; }
.hr-time{ margin-left:auto; color:var(--muted); font-size:13.5px; font-variant-numeric:tabular-nums; }
.hr-time .tz{ margin-left:8px; font-size:11px; font-weight:700; color:var(--ball-hi); }
.panel{ background:var(--court); border:1px solid var(--line); border-radius:16px; padding:22px 24px; margin-bottom:14px; }
.panel h3{ font:800 26px/1.05 var(--display); text-transform:uppercase; margin-bottom:8px; }
.panel p{ color:var(--muted); margin-bottom:16px; max-width:70ch; }

/* ---------- License ---------- */
.cert{ max-width:820px; margin:30px auto 0; padding:12px; border-radius:22px; background:var(--pitch); box-shadow:0 40px 90px -40px rgba(0,0,0,.85); }
.cert-in{ position:relative; border:2px solid rgba(255,255,255,.7); border-radius:14px; padding:54px 52px 46px; background:linear-gradient(180deg, var(--pitch), var(--pitch-deep)); overflow:hidden; }
.cert-in::before{ content:""; position:absolute; left:50%; top:50%; width:340px; height:340px; transform:translate(-50%,-50%); border:2px solid rgba(255,255,255,.12); border-radius:50%; }
.cert-in::after{ content:""; position:absolute; left:0; right:0; top:50%; height:2px; background:rgba(255,255,255,.1); }
.cert-in > *{ position:relative; z-index:1; }
.cert-mark{ width:78px; height:78px; margin-bottom:16px; filter:drop-shadow(0 6px 10px rgba(0,0,0,.4)); }
.cert .org{ color:#CFE0FA; font-size:14px; }
.cert h1{ font:900 clamp(46px,7vw,82px)/.9 var(--display); text-transform:uppercase; margin:8px 0 14px; }
.cert .no{ display:inline-block; font-weight:600; font-size:13.5px; padding:6px 12px; border-radius:8px; background:rgba(8,17,31,.55); }
.cert-body{ margin-top:30px; max-width:62ch; }
.cert-body p{ margin-bottom:14px; font-size:16px; line-height:1.7; color:#EAF1FF; }
.cert-body b{ color:#fff; }
.cert-clause{ margin-top:22px; padding:14px 16px; border-radius:10px; background:rgba(8,17,31,.5); font-size:12.5px; color:#CFE0FA; line-height:1.6; }
.cert-sig{ display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-top:38px; flex-wrap:wrap; }
.cert-sig > div:first-child{ flex:1 1 380px; max-width:470px; }
.sig-ink{ display:block; width:min(450px,100%); height:auto; fill:#F4F8FF; stroke:#F4F8FF; stroke-width:.7; stroke-linejoin:round; opacity:.97; transform:rotate(-3deg); transform-origin:12% 90%; margin:0 0 -12px 0; filter:drop-shadow(0 1px 0 rgba(0,0,0,.25)); pointer-events:none; }
.sig-line{ height:2px; background:rgba(255,255,255,.7); margin:8px 0; min-width:260px; }
.sig-title{ font-size:13px; color:#CFE0FA; max-width:34ch; }
.stamp{ width:112px; height:112px; flex-shrink:0; transform:rotate(-11deg); }
.patch-shell{ max-width:820px; margin:64px auto 0; }
.patch{ border-bottom:1px solid var(--line); }
.patch summary{ list-style:none; display:flex; align-items:baseline; gap:16px; padding:18px 4px; cursor:pointer; }
.patch summary::-webkit-details-marker{ display:none; }
.patch summary::after{ content:"+"; margin-left:auto; font:700 22px/1 var(--display); color:var(--muted); }
.patch[open] summary::after{ content:"–"; color:var(--ball); }
.patch .v{ font:900 26px/1 var(--display); color:var(--ball); min-width:56px; }
.patch .t{ font-weight:600; }
.patch ul{ list-style:none; display:grid; gap:10px; padding:0 4px 22px 72px; }
.patch li{ color:var(--chalk-2); font-size:14.5px; line-height:1.6; position:relative; }
.patch li::before{ content:""; position:absolute; left:-18px; top:.62em; width:6px; height:6px; border-radius:50%; background:var(--faint); }

/* ---------- Footer, toast, sync ---------- */
.foot{ border-top:1px solid var(--line); margin-top:40px; }
.foot-in{ max-width:var(--max); margin:0 auto; padding:34px 24px 44px; display:flex; justify-content:space-between; gap:24px; flex-wrap:wrap; font-size:13.5px; color:var(--muted); }
.foot-in b{ display:block; color:var(--chalk); font:800 20px/1 var(--display); letter-spacing:.05em; text-transform:uppercase; margin-bottom:8px; }
.foot-link{ color:var(--chalk); cursor:pointer; text-decoration:underline; text-underline-offset:4px; text-decoration-color:var(--ball); text-decoration-thickness:2px; }
.foot-link:hover{ color:var(--ball-hi); }
.foot-right{ text-align:right; }
.credit-line{ margin-top:6px; font-style:italic; }
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); z-index:300; max-width:calc(100vw - 32px);
  background:var(--chalk); color:var(--night); padding:13px 20px; border-radius:12px; font-weight:600; font-size:14px;
  box-shadow:0 18px 40px rgba(0,0,0,.5); opacity:0; transition:.3s; pointer-events:none; display:flex; align-items:center; gap:10px;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
.toast .ic{ color:var(--ball-dim,#D95F17); font-size:11px; }
.sync-badge{
  position:fixed; bottom:18px; right:18px; z-index:200; font-size:12px; font-weight:500; padding:7px 13px; border-radius:999px;
  display:flex; align-items:center; gap:8px; background:var(--court); border:1px solid var(--line-2); color:var(--muted);
  opacity:0; transform:translateY(8px); transition:.3s; pointer-events:none;
}
.sync-badge.show{ opacity:1; transform:translateY(0); }
.sync-badge .dot{ width:8px; height:8px; border-radius:50%; background:var(--faint); }
.sync-badge.live .dot{ background:var(--green); animation:pulse 1.8s ease-in-out infinite; }
.sync-badge.offline{ color:var(--red); border-color:rgba(240,82,79,.4); }
.sync-badge.offline .dot{ background:var(--red); }
@keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(61,220,151,.5); } 60%{ box-shadow:0 0 0 6px rgba(61,220,151,0); } }

/* ---------- Responsive ---------- */
@media(max-width:1020px){
  .hero{ grid-template-columns:1fr; gap:40px; padding-top:44px; }
  .profile{ grid-template-columns:220px minmax(0,1fr); gap:34px; }
  .honours{ grid-template-columns:1fr; }
}
@media(max-width:900px){
  .roster-columns, .team-tables{ grid-template-columns:1fr; }
  .fx-grid{ grid-template-columns:1fr; }
}
@media(max-width:820px){
  .topbar-in{ flex-wrap:wrap; padding:10px 16px; gap:8px 14px; }
  .brand-sub{ display:none; }
  .topbar-right{ margin-left:auto; }
  .mainnav{ order:3; flex:none; width:100%; margin:0 -6px; }
  .navbtn.active::after{ bottom:-4px; left:12px; right:12px; }
  .stat-grid{ grid-template-columns:repeat(2,1fr); }

/* =========================================================
   Luxe layer — champagne gold on deep ink. The player card is the
   one showpiece; everything else stays quiet and fine-lined.
========================================================= */
:root{
  --ball:#E2B96B; --ball-hi:#F1D597; --ball-dim:#B58A3C; --ball-soft:rgba(226,185,107,.14);
  --night:#060B16; --night-2:#0A1325; --court:#0E192E;
  --line:rgba(226,185,107,.13); --line-2:rgba(226,185,107,.3);
  --serif:'Cormorant Garamond','Iowan Old Style',Georgia,serif;
}
body{ background:
  radial-gradient(900px 480px at 82% -10%, rgba(226,185,107,.10), transparent 62%),
  radial-gradient(1100px 560px at 70% -8%, rgba(34,92,190,.26), transparent 62%),
  radial-gradient(800px 460px at -5% 40%, rgba(22,60,130,.16), transparent 60%), var(--night); background-repeat:no-repeat; }
.topbar{ background:rgba(6,11,22,.86); border-bottom:1px solid var(--line-2); box-shadow:0 18px 40px -28px #000; }
.brand-name{ font:700 21px/1 var(--serif); letter-spacing:.09em; }
.brand-sub{ letter-spacing:.04em; }
.navbtn.active::after{ background:linear-gradient(90deg,transparent,var(--ball),transparent); }
.btn{ border-radius:999px; padding:11px 22px; letter-spacing:.01em; }
.btn.primary{ background:linear-gradient(180deg,var(--ball-hi),var(--ball) 52%,var(--ball-dim)); border-color:var(--ball-hi); color:#1A1104;
  box-shadow:0 10px 26px -10px rgba(226,185,107,.6), inset 0 1px 0 rgba(255,255,255,.45); }
.btn.primary:hover{ filter:brightness(1.07); }
.hero h1{ font:600 clamp(54px,7.6vw,102px)/.94 var(--serif); text-transform:none; letter-spacing:-.02em; }
.page-head h1{ font:600 clamp(44px,6vw,74px)/.98 var(--serif); text-transform:none; letter-spacing:-.015em; }
.sec-head h2, .h2{ font:600 clamp(32px,3.8vw,46px)/1 var(--serif); text-transform:none; letter-spacing:-.01em; }
.sec-head{ padding-bottom:14px; border-bottom:1px solid var(--line); }
.facts b{ font:600 48px/1 var(--serif); color:var(--ball-hi); }
.court-panel, .honour, .form-shell, .team-table-wrap, .match-note{
  background:linear-gradient(180deg,rgba(255,255,255,.04),transparent 38%), var(--court);
  border:1px solid var(--line-2); border-radius:20px; box-shadow:0 30px 60px -34px #000, inset 0 1px 0 rgba(255,255,255,.06); }
.court-panel{ overflow:hidden; }
.honour .tr{ filter:drop-shadow(0 0 14px rgba(242,193,78,.45)); }
.honour .team{ font:600 34px/1.05 var(--serif); text-transform:none; }
.board-score b.win{ color:var(--ball-hi); }
.sub-chip.pos{ background:rgba(226,185,107,.16); color:var(--ball-hi); }
.hero > *{ animation:lux-in .9s cubic-bezier(.2,.7,.2,1) both; }
.hero > *:nth-child(2){ animation-delay:.14s; }
@keyframes lux-in{ from{ opacity:0; transform:translateY(14px); } }

/* ---- player card: foil frame ---- */
.pcard{ background:linear-gradient(135deg,var(--ta) 0%,rgba(255,255,255,.55) 16%,var(--ta) 34%,rgba(255,255,255,.1) 52%,var(--ta) 76%,rgba(255,255,255,.5) 100%); }
.pcard.t-gold{ --t1:#6B5214; --t2:#1E1505; }
.pc-frame{ box-shadow:inset 0 0 0 1px rgba(255,255,255,.1), inset 0 -70px 80px -50px rgba(0,0,0,.55); }
.pc-rate{ text-shadow:0 2px 18px rgba(0,0,0,.45); }
.pc-name{ letter-spacing:.06em; border-top:1px solid color-mix(in srgb,var(--ta) 55%,transparent); }
.pc-skill{ display:flex; justify-content:center; gap:14px; position:relative; z-index:1; margin-top:9px; padding-top:7px; border-top:1px solid rgba(255,255,255,.1); }
.pc-skill span{ font-size:9.5px; letter-spacing:.08em; color:var(--chalk-2); text-align:center; }
.pc-skill b{ display:block; font:800 14px/1.1 var(--display); color:var(--ta); letter-spacing:0; }

/* ---- add-match: position + x/y fields ---- */
.player-row .pos-wrap, .player-row .pair-wrap, .player-row .bc-wrap{ grid-column:span 2; min-width:0; }
.player-row select{ width:100%; background:var(--court); border:1px solid var(--line); color:var(--chalk); border-radius:8px; padding:8px 4px; font:inherit; font-size:13px; color-scheme:dark; }
.player-row select:focus{ outline:none; border-color:var(--ball); box-shadow:0 0 0 3px var(--ball-soft); }
.player-row .pair{ display:flex; align-items:center; gap:3px; }
.player-row .pair input{ min-width:0; padding:8px 2px; }
.player-row .pair em{ font-style:normal; color:var(--faint); }

/* ---- match player card popup ---- */
.mpc{ --ta:var(--bronze); --t1:#3B2417; --t2:#1B1009; width:min(400px,100%); max-height:92vh; overflow:auto; border-radius:24px; padding:1.5px;
  background:linear-gradient(140deg,var(--ta),rgba(255,255,255,.55) 20%,var(--ta) 40%,rgba(255,255,255,.1) 60%,var(--ta) 85%);
  box-shadow:0 50px 100px -20px rgba(0,0,0,.9), 0 0 90px -34px var(--ta); animation:rise .28s cubic-bezier(.2,.8,.2,1); }
.mpc.t-silver{ --t1:#2F394B; --t2:#141A25; --ta:var(--silver); }
.mpc.t-gold{ --t1:#6B5214; --t2:#1E1505; --ta:var(--gold); }
.mpc.t-icon{ --t1:#1D4F86; --t2:#2A1B5E; --ta:var(--icon); }
.mpc-in{ position:relative; border-radius:22.5px; padding:24px 22px 20px; background:linear-gradient(165deg,var(--t1),var(--t2) 85%); }
.mpc-x{ position:absolute; right:14px; top:10px; width:34px; height:34px; border-radius:50%; border:1px solid rgba(255,255,255,.2); background:rgba(0,0,0,.25); font-size:22px; line-height:1; }
.mpc-x:hover{ background:rgba(255,255,255,.12); }
.mpc-head{ display:flex; gap:16px; align-items:center; padding-right:34px; }
.mpc-ovr{ text-align:center; }
.mpc-ovr b{ display:block; font:900 66px/.85 var(--display); color:var(--ta); text-shadow:0 2px 18px rgba(0,0,0,.5); }
.mpc-ovr span{ font-size:11px; letter-spacing:.14em; color:var(--ta); }
.mpc-id{ min-width:0; padding-left:16px; border-left:1px solid rgba(255,255,255,.18); }
.mpc-id h4{ font:800 28px/1 var(--display); text-transform:uppercase; letter-spacing:.04em; overflow-wrap:anywhere; }
.mpc-id p{ font-size:13px; color:var(--chalk-2); margin-top:5px; }
.mpc-tags{ display:flex; gap:6px; flex-wrap:wrap; margin-top:14px; }
.mpc-tags span{ font-size:11.5px; font-weight:600; padding:3px 10px; border-radius:999px; background:rgba(255,255,255,.1); color:var(--chalk); }
.mpc-tags span.bad{ background:rgba(240,82,79,.2); color:#FFB3B1; }
.mpc-hero{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:16px 0 10px; }
.mpc-hero div{ text-align:center; padding:14px 6px 10px; border-radius:16px; background:rgba(0,0,0,.28); border:1px solid rgba(255,255,255,.09); }
.mpc-hero b{ display:block; font:900 50px/.9 var(--display); color:var(--ta); }
.mpc-hero span{ font-size:12px; line-height:1.2; color:var(--chalk-2); display:block; margin-top:3px; }
.mpc-mini{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; text-align:center; padding:10px 0; border-block:1px solid rgba(255,255,255,.1); }
.mpc-mini b{ display:block; font:800 22px/1.1 var(--display); }
.mpc-mini span{ font-size:11px; color:var(--chalk-2); }
.mpc-meters{ display:grid; gap:12px; margin:16px 0 4px; }
.mpc-m-top{ display:flex; justify-content:space-between; font-size:13px; color:var(--chalk-2); }
.mpc-m-top b{ color:var(--chalk); font-variant-numeric:tabular-nums; }
.mpc-bar{ height:6px; border-radius:6px; background:rgba(255,255,255,.1); margin:6px 0 3px; overflow:hidden; }
.mpc-bar i{ display:block; height:100%; border-radius:6px; background:linear-gradient(90deg,var(--ta),#fff); }
.mpc-m small{ font-size:11.5px; color:var(--muted); }
.mpc-foot{ display:flex; gap:10px; margin-top:18px; }
.mpc-foot .btn{ flex:1; }
@media(max-width:600px){ .mpc-hero b{ font-size:42px; } .mpc-ovr b{ font-size:54px; } .mpc-id h4{ font-size:23px; } }
</style>

    // see this, check that the two firebasejs <script src> tags are
    // above this <script> block in the HTML and that nothing (like an
    // ad-blocker) is stopping them from loading.
    throw new Error('Firebase SDK not loaded.');
  }
  if(firebaseConfig.apiKey === "YOUR_API_KEY"){
    throw new Error('Firebase is not configured yet — paste your project keys into firebaseConfig.');
  }
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  firebaseReady = true;
}catch(e){
  firebaseInitError = e.message;
  console.error('Firebase init failed:', e);
}

// Top-level database locations. Each one is kept as a single JSON blob
// (an array/object) and re-synced as a whole on every write — simple,
// and plenty fast for a club-sized dataset like this.
const matchesRef = firebaseReady ? db.ref('matches') : null;
const positionsRef = firebaseReady ? db.ref('positions') : null;
const loginHistoryRef = firebaseReady ? db.ref('loginHistory') : null;
const playerDataRef = firebaseReady ? db.ref('playerData') : null;
const seasonMetaRef = firebaseReady ? db.ref('seasonMeta') : null;
const connectedRef = firebaseReady ? db.ref('.info/connected') : null;

// Tracks whether each location has delivered its first value yet.
// STATE.loaded only flips to true once all of them have — and
// importantly, each one flips its flag even on error, so a bad
// config or a permissions problem can never leave the "LOADING
// OFFICIAL RECORDS…" screen spinning forever.
const loadFlags = { matches:false, positions:false, loginHistory:false, playerData:false, seasonMeta:false };
function markLoadedAndRender(key){
  loadFlags[key] = true;
  if(loadFlags.matches && loadFlags.positions && loadFlags.loginHistory && loadFlags.playerData && loadFlags.seasonMeta){
    STATE.loaded = true;
  }
  render();
}

function startRealtimeSync(){
  if(!firebaseReady){
    // No hanging spinner — surface the problem immediately instead.
    STATE.loaded = true;
    render();
    updateSyncBadge('offline');
    return;
  }

  matchesRef.on('value', snap => {
    const val = snap.val();
    STATE.matches = val ? Object.values(val) : [];
    markLoadedAndRender('matches');
  }, err => {
    console.error('matches sync error:', err);
    firebaseInitError = "Could not read match data (check your Database Rules).";
    markLoadedAndRender('matches');
  });

  positionsRef.on('value', snap => {
    STATE.positions = snap.val() || {};
    markLoadedAndRender('positions');
  }, err => {
    console.error('positions sync error:', err);
    markLoadedAndRender('positions');
  });

  loginHistoryRef.on('value', snap => {
    const val = snap.val();
    STATE.loginHistory = val ? Object.values(val) : [];
    markLoadedAndRender('loginHistory');
  }, err => {
    console.error('loginHistory sync error:', err);
    markLoadedAndRender('loginHistory');
  });

  playerDataRef.on('value', snap => {
    STATE.playerData = snap.val() || {};
    markLoadedAndRender('playerData');
  }, err => {
    console.error('playerData sync error:', err);
    markLoadedAndRender('playerData');
  });

  seasonMetaRef.on('value', snap => {
    const val = snap.val();
    STATE.seasonMeta = val && val.current ? { current: val.current, history: val.history || [] } : { current: 1, history: [] };
    markLoadedAndRender('seasonMeta');
  }, err => {
    console.error('seasonMeta sync error:', err);
    markLoadedAndRender('seasonMeta');
  });

  connectedRef.on('value', snap => {
    updateSyncBadge(snap.val() === true ? 'live' : 'offline');
  });
}

function updateSyncBadge(status){
  const el = document.getElementById('sync-badge');
  if(!el) return;
  el.classList.add('show');
  el.classList.remove('live','offline');
  if(status === 'live'){
    el.classList.add('live');
    el.innerHTML = `<span class="dot"></span><span class="sync-text">Live — syncing for everyone</span>`;
  }else{
    el.classList.add('offline');
    el.innerHTML = `<span class="dot"></span><span class="sync-text">${firebaseInitError ? 'Not connected' : 'Reconnecting…'}</span>`;
  }
}

/* =========================================================
   Utilities
========================================================= */
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function normalize(name){
  return String(name||"").trim().replace(/\s+/g," ").toLowerCase();
}
/* Deterministic team-crest colour + initial, derived from the team name so
   the same team always gets the same badge without being stored anywhere. */
function teamBadge(name){
  const s = String(name||'').trim();
  let hash = 0;
  for(let i=0;i<s.length;i++){ hash = (hash*31 + s.charCodeAt(i)) >>> 0; }
  const hue = hash % 360;
  const initial = (s.match(/[A-Za-z0-9]/)||['?'])[0].toUpperCase();
  return { hue, initial };
}
function titleCasePreserve(name){
  return String(name||"").trim().replace(/\s+/g," ");
}
function levenshtein(a,b){
  a = a.toLowerCase(); b = b.toLowerCase();
  const m=a.length, n=b.length;
  const dp = Array.from({length:m+1},(_,i)=>[i, ...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j-1], dp[i-1][j], dp[i][j-1]);
    }
  }
  return dp[m][n];
}
function formatDate(d){
  if(!d) return "—";
  const dt = new Date(d+"T00:00:00");
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-GB',{ day:'2-digit', month:'short', year:'numeric' });
}
function uid(){ return 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }

function formatIST(ts){
  const d = new Date(ts);
  const datePart = d.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric', timeZone:'Asia/Kolkata' });
  const timePart = d.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:true, timeZone:'Asia/Kolkata' });
  return { date: datePart, time: timePart };
}

   Player data — birthdate / height / weight / age (admin-set)
   and the Player Achievements trophy cabinet (admin-tallied).
   None of this appears anywhere in match registration; it only
   ever shows on an individual player's profile page.
========================================================= */
const TROPHY_DEFS = {
  bestPlayer:      { label:'Best Player' },
  topScorer:       { label:'Most Goalscorer' },
  mostAssist:      { label:'Most Assist' },
  mostCleanSheets: { label:'Most Clean Sheets' },
  bestGK:          { label:'Best Goalkeeper' },
  bestYoung:       { label:'Best Young Player' },
  bestDefender:    { label:'Best Defender' }
};

  return {

    height: d.height!=null ? d.height : '',
    weight: d.weight!=null ? d.weight : '',
    trophies: Object.assign(
      Object.fromEntries(Object.keys(TROPHY_DEFS).map(k=>[k,0])),
      d.trophies || {}
    )
  };
}

function calculateAge(birthdateStr){
  if(!birthdateStr) return null;
  const bd = new Date(birthdateStr+"T00:00:00");
  if(isNaN(bd)) return null;
  const now = new Date();
  let years = now.getFullYear() - bd.getFullYear();
  let months = now.getMonth() - bd.getMonth();
  if(now.getDate() < bd.getDate()) months -= 1;
  if(months < 0){ years -= 1; months += 12; }
  if(years < 0) return null;
  return { years, months };
}

/* Market value — a fun, FC-Ultimate-Team-style estimate. Rating drives
   the base value on an exponential curve (like real transfer markets,
   where elite ratings are worth disproportionately more), then age
   scales it: 16 is treated as this league's prime age, and value
   tapers off the further a player's age sits from that peak in either
   direction. No birthdate on file just means no age adjustment yet —
   value is still shown, based on rating alone. */
function calcMarketValue(rating, ageYears){
  const base = Math.pow(1.09, rating - 40) * 8000;
  let ageMultiplier = 1;
  if(ageYears != null){
    const diff = Math.abs(ageYears - 16);
    ageMultiplier = Math.max(0.35, 1 - diff*0.045);
  }
  return Math.round(base * ageMultiplier / 500) * 500;
}
function formatMarketValue(v){
  if(v >= 1000000) return '€' + (v/1000000).toFixed(1).replace(/\.0$/,'') + 'M';
  if(v >= 1000) return '€' + (v/1000).toFixed(v%1000===0?0:1) + 'K';
  return '€' + v;
}

/* Season Highlights — computed automatically from every match entry.
   Not shown as its own stats page; only surfaced inside a player's profile. */
function getSeasonHighlights(normName, matchList){
  matchList = matchList || STATE.matches;
  const hattricks = [], assistHats = [], cleanSheets = [];
  matchList.forEach(m=>{
    [['team1','team2'],['team2','team1']].forEach(([own,opp])=>{
      const player = m[own].players.find(p=>normalize(p.name)===normName);
      if(!player) return;
      const goals = Number(player.goals)||0;
      const assists = Number(player.assists)||0;
      if(goals >= 3) hattricks.push({ match:m, value:goals, teamName:m[own].name, oppName:m[opp].name });
      if(assists >= 3) assistHats.push({ match:m, value:assists, teamName:m[own].name, oppName:m[opp].name });
      if(m[own].cleanSheet && Array.isArray(m[own].cleanSheetPlayers) && m[own].cleanSheetPlayers.some(n=>normalize(n)===normName)){
        cleanSheets.push({ match:m, teamName:m[own].name, oppName:m[opp].name });
      }
    });
  });
  const byDate = (a,b)=> (b.match.date||'').localeCompare(a.match.date||'') || b.match.createdAt-a.match.createdAt;
  hattricks.sort(byDate); assistHats.sort(byDate); cleanSheets.sort(byDate);
  return { hattricks, assistHats, cleanSheets };
}

/* =========================================================
   Football card rating (community "FC rating", 40-99 scale)
========================================================= */
/* Technical bonus: big chances created (a plain count), dribbling and defensive success rates feed the OVR.
   Each rate is shrunk toward a league-average prior (so 1/1 never beats 18/20),
   then a small volume bonus rewards doing it often. Matches logged before these
   stats existed have no attempts, so their ratings are untouched. */
function skillBonus(p){
  const f = (c,a,prior,w,cap,per)=>{
    c = c||0; a = a||0; if(!a) return 0;
    const adj = (c + prior*8) / (a + 8);
    return (adj - prior)*w + Math.min(cap, c*per);
  };
  return Math.min(4, (p.bigChances||0)*0.4)
       + f(p.dribComp,p.dribAtt,.50,8,3,.12)
       + f(p.defComp,p.defAtt,.60,10,4,.10);
}
function pctNum(c,a){ return a>0 ? Math.round(100*c/a) : null; }
function pctTxt(c,a){ const v = pctNum(c,a); return v==null ? '—' : v; }

function cardRating(p){
  const avg = p.ratingCount ? (p.ratingSum/p.ratingCount) : 5.0;
  let score = 30
    + Math.min(15, (p.goals || 0) * 0.4)
    + Math.min(10, (p.assists || 0) * 0.3)
    + Math.min(8, (p.saves || 0) * 0.2)
    + Math.min(10, (p.motm || 0) * 1.0)
    + (avg * 4.5)
    - ((p.yellow || 0) * 5.0)
    + skillBonus(p)
    - ((p.red || 0) * 25.0);

  const mDur = typeof MATCH_DURATION_MINUTES !== 'undefined' ? MATCH_DURATION_MINUTES : 60;
  const minutesPlayed = p.minutesPlayed != null ? p.minutesPlayed : ((p.matches || 0) * mDur);
  const avgMinutes = p.matches ? minutesPlayed / p.matches : mDur;
  const workloadFactor = 0.8 + 0.2 * Math.min(1, avgMinutes / mDur);

  let wf = score * workloadFactor;
  let finalRating = wf <= 72 ? wf : 72 + 8.5 * Math.log1p((wf - 72) / 4.0);

  return Math.max(40, Math.min(99, Math.round(finalRating)));
}
/* A small badge next to any displayed rating (FC card, player profile):
   90+ earns a star, 85-89 earns a diamond icon, anything lower gets
   no badge at all. */
function ratingBadge(rating){
  if(rating>=90) return `<span class="rating-badge star" title="90+ rated">★</span>`;
  if(rating>=85) return `<span class="rating-badge icon" title="85+ rated">◆</span>`;
  return '';
}

/* "Best Player" season-impact score. Deliberately NOT based on Man of
   the Match count — MOTM rewards one or two standout matches, which
   isn't the same as being the Federation's best player over a full,
   grueling season. Instead this rewards three things together:
     - presence: appearances made (being consistently available)
     - direct impact: equal and very low contribution from attack (goals/assists) and saves, preventing stat farming by attackers
     - sustained quality: heavily dominated by average match rating across every appearance to properly balance midfielders, defenders, and goalkeepers
*/
function bestPlayerScore(p){ const avgRating = p.ratingCount ? (p.ratingSum / p.ratingCount) : 0;

const attackContrib = ((p.goals || 0) + (p.assists || 0)) * 0.005;
const saveContrib = (p.saves || 0) * 0.005;

// Target matches needed for 100% full rating boost multiplier
const TARGET_MATCHES = 20;

// Power curve penalty: (10 / 20)^1.5 = ~0.35 (Only 35% rating weight for 10 matches)
// (19 / 20)^1.5 = ~0.92 (92% rating weight for 19 matches)
const matchWeight = Math.pow(Math.min(1, (p.matches || 0) / TARGET_MATCHES), 1.5);

// The match rating boost is scaled exponentially by matches played
const ratingContrib = avgRating * 25.0 * matchWeight;

// Minimal base match points
const matchContrib = (p.matches || 0) * 0.01;

return matchContrib + attackContrib + saveContrib + ratingContrib;

}

function getAllPlayerNames(){
  const set = new Map(); // normalized -> canonical display name
  STATE.matches.forEach(m=>{
    [...m.team1.players, ...m.team2.players].forEach(p=>{
      const n = normalize(p.name);
      if(n && !set.has(n)) set.set(n, p.name);
    });
  });
  return set; // Map normalized -> display
}

function findCanonical(inputName, registryMap){
  const n = normalize(inputName);
  if(!n) return { exact:null, suggestion:null };
  if(registryMap.has(n)) return { exact: registryMap.get(n), suggestion:null };
  // fuzzy: find closest within distance 2, min length 3
  let best=null, bestDist=99;
  registryMap.forEach((display, key)=>{
    if(Math.abs(key.length - n.length) > 3) return;
    const d = levenshtein(n, key);
    if(d < bestDist){ bestDist = d; best = display; }
  });
  if(best && bestDist <= 2 && n.length >= 3) return { exact:null, suggestion: best };
  return { exact:null, suggestion:null };
}

/* =========================================================
   Stats computation
========================================================= */
function computeAggregates(matchList){
  matchList = matchList || STATE.matches;
  const players = {}; // normalized -> {name, goals, ownGoals, assists, saves, yellow, red, motm, ratingSum, ratingCount, matches, minutesPlayed}
  function ensure(name){
    const n = normalize(name);
    if(!players[n]) players[n] = { name: titleCasePreserve(name), goals:0, ownGoals:0, assists:0, saves:0, yellow:0, red:0, motm:0, ratingSum:0, ratingCount:0, matches:0, minutesPlayed:0, dribComp:0, dribAtt:0, bigChances:0, defComp:0, defAtt:0 };
    return players[n];
  }
  matchList.forEach(m=>{
    [...m.team1.players, ...m.team2.players].forEach(p=>{
      const rec = ensure(p.name);
      rec.goals += Number(p.goals)||0;
      rec.ownGoals += Number(p.ownGoals)||0;
      rec.assists += Number(p.assists)||0;
      rec.saves += Number(p.saves)||0;
      ['dribComp','dribAtt','bigChances','defComp','defAtt'].forEach(k=>{ rec[k] += Number(p[k])||0; });
      rec.yellow += Number(p.yellow)||0;
      rec.red += Number(p.red)||0;
      rec.matches += 1;
      // MATCH_DURATION_MINUTES = 60 (two 30-minute halves). Older matches
      // saved before minutes were tracked default to a full 60 so their
      // rating impact doesn't silently change.
      rec.minutesPlayed += (p.minutesPlayed!=null && p.minutesPlayed!=='') ? Number(p.minutesPlayed) : MATCH_DURATION_MINUTES;
      if(p.rating!==""&&p.rating!=null){ rec.ratingSum += Number(p.rating)||0; rec.ratingCount += 1; }
    });
    if(m.motm){
      const n = normalize(m.motm);
      if(players[n]) players[n].motm += 1;
    }
  });
  return Object.values(players).map(p=>{ p.ga = p.goals + p.assists; return p; });
}

/* =========================================================
   Seasons — leaderboards & FC-card stats reset per season,
   but a player's FC Rating is always computed from every match
   ever played (seasonMatchList / 'all' below), so rating carries
   over season to season and only the visible counting stats reset.
========================================================= */
function seasonMatchList(seasonNum){
  // Matches saved before this feature existed have no .season tag —
  // treat them as belonging to Season 1, same as STATE.seasonMeta
  // starting at 1, so nothing changes for an archive that hasn't
  // ended a season yet.
  return STATE.matches.filter(m => (m.season || 1) === seasonNum);
}
function resolveSeasonMatchList(seasonSel){
  // seasonSel is 'all', 'current', or a season number (string or number)
  if(seasonSel === 'all') return STATE.matches;
  if(seasonSel === 'current') return seasonMatchList(STATE.seasonMeta.current);
  return seasonMatchList(Number(seasonSel));
}
function seasonOptionsList(){
  // Newest first: current season, then every ended season descending.
  const opts = [{ value:'current', label:`Season ${STATE.seasonMeta.current} (current)` }];
  STATE.seasonMeta.history.slice().sort((a,b)=>b.number-a.number).forEach(s=>{
    opts.push({ value:String(s.number), label:`Season ${s.number}` });
  });
  return opts;
}

/* Returns the full match history for one player (by normalized name), most recent first */
function getPlayerHistory(normName, matchList){
  matchList = matchList || STATE.matches;
  const rows = [];
  matchList.forEach(m=>{
    [['team1','team2'],['team2','team1']].forEach(([own,opp])=>{
      const found = m[own].players.find(p=>normalize(p.name)===normName);
      if(found){
        rows.push({ match:m, teamName:m[own].name, oppName:m[opp].name, ownScore:scoreOf(m[own], m[opp]), oppScore:scoreOf(m[opp], m[own]), stats:found });
      }
    });
  });
  rows.sort((a,b)=> (b.match.date||'').localeCompare(a.match.date||'') || b.match.createdAt-a.match.createdAt);
  // de-duplicate in case a player somehow appears twice (shouldn't, but guards against corrupt data)
  const seen = new Set();
  return rows.filter(r=>{ if(seen.has(r.match.id)) return false; seen.add(r.match.id); return true; });
}

function byNewest(a,b){ return (b.date||'').localeCompare(a.date||'') || (b.createdAt||0)-(a.createdAt||0); }
function monogram(name){
  return (String(name||'').match(/[A-Za-z0-9]+/g)||['?']).slice(0,2).map(w=>w[0].toUpperCase()).join('');
}
function shortName(n){
  const s = String(n||'').trim();
  if(s.length<=12) return s;
  const parts = s.split(/\s+/);
  if(parts.length>1){
    const first = parts[0].length>9 ? parts[0].slice(0,9)+'…' : parts[0];
    return first + ' ' + parts[parts.length-1][0].toUpperCase() + '.';
  }
  return s.slice(0,11)+'…';
}
function longDate(d){
  if(!d) return '—';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-GB',{ weekday:'short', day:'numeric', month:'short', year:'numeric' });
}

/* ---------- The court: a drawn 5-a-side pitch with the starting players ---------- */
function lineupSlots(team){
  let ps = (team.players||[]).filter(p=>!p.isSub);
  if(!ps.length) ps = (team.players||[]).slice();
  ps = ps.slice(0,7);
  // a position chosen for THIS match always beats the player's general position
  const posOf = p => p.pos || getPlayerPosition(normalize(p.name));
  let gk = ps.find(p=>p.pos==='GK') || ps.find(p=>!p.pos && getPlayerPosition(normalize(p.name))==='GK');
  if(!gk){
    const best = ps.slice().sort((a,b)=>(+b.saves||0)-(+a.saves||0))[0];
    if(best && (+best.saves||0)>0) gk = best;
  }
  const rest = ps.filter(p=>p!==gk);
  let rows;
  if(rest.some(p=>p.pos)){
    const groups = [[],[],[]];
    rest.forEach(p=>{ const q = posOf(p); groups[q==='DEF'?0 : q==='FWD'?2 : 1].push(p); });
    groups.forEach(g=>g.sort((a,b)=>(+a.goals||0)-(+b.goals||0)));
    rows = groups.filter(g=>g.length);
  }else{
    const weight = p=>{
      const pos = getPlayerPosition(normalize(p.name));
      return (pos==='DEF'?0 : pos==='MID'?1 : pos==='FWD'?3 : 2) + (+p.goals||0)*0.01 + (+p.assists||0)*0.004;
    };
    rest.sort((a,b)=>weight(a)-weight(b));
    const FORM = {1:[1],2:[2],3:[1,2],4:[1,2,1],5:[2,2,1],6:[2,3,1],7:[3,3,1]};
    let i = 0;
    rows = (FORM[rest.length]||[]).map(c=>rest.slice(i, i+=c));
  }
  const A = ({1:[.58],2:[.45,.72],3:[.38,.59,.79]})[rows.length] || [];
  const V = {1:[.5],2:[.27,.73],3:[.18,.5,.82],4:[.13,.38,.62,.87]};
  const slots = [];
  if(gk) slots.push({ p:gk, a:.11, v:.5, gk:true });
  rows.forEach((row,ri)=>{ row.forEach((p,j)=>{ slots.push({ p, a:A[ri], v:(V[Math.min(row.length,4)]||V[4])[j], gk:false }); }); });
  return slots;
}

function discSVG(p, cx, cy, kit, isGK, isMotm, mid){
  const norm = normalize(p.name);
  const goals = +p.goals||0;
  const fill = isGK ? '#F5C830' : (kit==='k1' ? '#FF7B2E' : '#EDF1F7');
  const ink  = isGK ? '#2A2003' : (kit==='k1' ? '#2A1304' : '#0A1322');
  const assists = +p.assists||0;
  const go = `event.stopPropagation();openMatchPlayerCard('${mid}','${esc(norm)}')`;
  return `<g class="disc" tabindex="0" role="link" aria-label="${esc(p.name)}" onclick="${go}" onkeydown="if(event.key==='Enter'){${go}}">
    <title>${esc(p.name)}${goals>0?` — ${goals} goal${goals===1?'':'s'}`:''}${isMotm?' — man of the match':''}</title>
    <g class="dc">
      <circle class="ring" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="17" fill="${fill}" stroke="${isMotm?'#fff':'rgba(8,17,31,.5)'}" stroke-width="${isMotm?3:2}"/>
      <text x="${cx.toFixed(1)}" y="${(cy+5.5).toFixed(1)}" text-anchor="middle" font-family="var(--display)" font-weight="800" font-size="16" fill="${ink}">${esc(monogram(p.name))}</text>
      ${goals>0 ? `<circle cx="${(cx+14).toFixed(1)}" cy="${(cy-14).toFixed(1)}" r="9" fill="#08111F" stroke="#fff" stroke-width="1.4"/><text x="${(cx+14).toFixed(1)}" y="${(cy-10).toFixed(1)}" text-anchor="middle" font-family="var(--body)" font-weight="700" font-size="11" fill="#fff">${goals}</text>` : ''}
      ${assists>0 ? `<circle cx="${(cx+14).toFixed(1)}" cy="${(cy+12).toFixed(1)}" r="8" fill="#7CB2FF" stroke="#08111F" stroke-width="1.4"/><text x="${(cx+14).toFixed(1)}" y="${(cy+16).toFixed(1)}" text-anchor="middle" font-family="var(--body)" font-weight="700" font-size="10.5" fill="#08111F">${assists}</text>` : ''}
      ${isMotm ? `<text x="${(cx-14).toFixed(1)}" y="${(cy-10).toFixed(1)}" text-anchor="middle" font-size="14" fill="#F5C830" stroke="#08111F" stroke-width=".8" paint-order="stroke">★</text>` : ''}
    </g>
    <text class="dn" x="${cx.toFixed(1)}" y="${(cy+33).toFixed(1)}" text-anchor="middle">${esc(shortName(p.name))}</text>
  </g>`;
}

function courtSVG(m, orient){
  const H = orient==='h';
  const W = 320, L = H ? 640 : 560;
  const vbW = H ? L : W, vbH = H ? W : L;
  const P = (u,v)=> H ? [u,v] : [W-v, u];
  const s = 14.6, m0 = 14, mid = L/2, cv = W/2, R = 6*s, gp = 1.5*s;
  const bandW = (L-2*m0)/10;
  const stripes = [0,1,2,3,4].map(i=>`<rect x="${(m0+bandW*(2*i+1)).toFixed(1)}" y="${m0}" width="${bandW.toFixed(1)}" height="${W-2*m0}"/>`).join('');
  const tf = H ? '' : ` transform="matrix(0 1 -1 0 ${W} 0)"`;
  let svg = `<svg class="court-${orient}" viewBox="0 0 ${vbW} ${vbH}" role="img" aria-label="Court diagram showing the starting players">
    <g${tf}>
      <g fill="#fff" opacity=".05">${stripes}</g>
      <g fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" opacity=".92">
        <rect x="${m0}" y="${m0}" width="${L-2*m0}" height="${W-2*m0}" rx="2"/>
        <line x1="${mid}" y1="${m0}" x2="${mid}" y2="${W-m0}"/>
        <circle cx="${mid}" cy="${cv}" r="${(3*s).toFixed(1)}"/>
        <path d="M${m0},${(cv-gp-R).toFixed(1)} A${R.toFixed(1)},${R.toFixed(1)} 0 0 1 ${(m0+R).toFixed(1)},${(cv-gp).toFixed(1)} L${(m0+R).toFixed(1)},${(cv+gp).toFixed(1)} A${R.toFixed(1)},${R.toFixed(1)} 0 0 1 ${m0},${(cv+gp+R).toFixed(1)}"/>
        <path d="M${L-m0},${(cv-gp-R).toFixed(1)} A${R.toFixed(1)},${R.toFixed(1)} 0 0 0 ${(L-m0-R).toFixed(1)},${(cv-gp).toFixed(1)} L${(L-m0-R).toFixed(1)},${(cv+gp).toFixed(1)} A${R.toFixed(1)},${R.toFixed(1)} 0 0 0 ${L-m0},${(cv+gp+R).toFixed(1)}"/>
        <rect x="${m0-9}" y="${(cv-gp).toFixed(1)}" width="9" height="${(2*gp).toFixed(1)}"/>
        <rect x="${L-m0}" y="${(cv-gp).toFixed(1)}" width="9" height="${(2*gp).toFixed(1)}"/>
        <path d="M${m0},${m0+8} A8,8 0 0 0 ${m0+8},${m0}"/>
        <path d="M${L-m0-8},${m0} A8,8 0 0 0 ${L-m0},${m0+8}"/>
        <path d="M${L-m0},${W-m0-8} A8,8 0 0 0 ${L-m0-8},${W-m0}"/>
        <path d="M${m0+8},${W-m0} A8,8 0 0 0 ${m0},${W-m0-8}"/>
      </g>
      <g fill="#fff" opacity=".92">
        <circle cx="${mid}" cy="${cv}" r="3.2"/>
        <circle cx="${(m0+R).toFixed(1)}" cy="${cv}" r="2.6"/><circle cx="${(L-m0-R).toFixed(1)}" cy="${cv}" r="2.6"/>
        <circle cx="${(m0+10*s).toFixed(1)}" cy="${cv}" r="2.6"/><circle cx="${(L-m0-10*s).toFixed(1)}" cy="${cv}" r="2.6"/>
      </g>
    </g>`;
  if(m){
    const motmN = m.motm ? normalize(m.motm) : '';
    [[m.team1,1],[m.team2,2]].forEach(([team,side])=>{
      lineupSlots(team).forEach(slot=>{
        const off = Math.max(slot.a*mid, slot.gk ? 48 : 0);
        const u = side===1 ? off : L - off;
        const [x,y] = P(u, slot.v*W);
        svg += discSVG(slot.p, x, y, side===1?'k1':'k2', slot.gk, !!motmN && normalize(slot.p.name)===motmN, m.id);
      });
    });
  }
  return svg + '</svg>';
}
