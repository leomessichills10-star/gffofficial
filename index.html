}

function openMatchPlayerCard(matchId, norm){
  const m = STATE.matches.find(x=>x.id===matchId); if(!m) return;
  let p=null, own=null, opp=null;
  [[m.team1,m.team2],[m.team2,m.team1]].forEach(([a,b])=>{ const f=a.players.find(x=>normalize(x.name)===norm); if(f){ p=f; own=a; opp=b; } });
  if(!p) return;
  const agg = computeAggregates().find(x=>normalize(x.name)===norm);
  const ovr = agg ? cardRating(agg) : 40;
  const tier = ratingTier(ovr);
  const os = scoreOf(own,opp), ps = scoreOf(opp,own);
  const res = os>ps ? 'Win' : os<ps ? 'Loss' : 'Draw';
  const pos = p.pos || getPlayerPosition(norm);
  const posLabel = pos ? ((POSITIONS[pos]&&POSITIONS[pos].label)||pos) : 'Position not set';
  const isMotm = m.motm && normalize(m.motm)===norm;
  const isCS = own.cleanSheet && Array.isArray(own.cleanSheetPlayers) && own.cleanSheetPlayers.some(n=>normalize(n)===norm);
  const meter = (label,c,a)=>{ const v = pctNum(c,a); return `<div class="mpc-m"><div class="mpc-m-top"><span>${label}</span><b>${a>0 ? c+' / '+a : '—'}</b></div><div class="mpc-bar"><i style="width:${v==null?0:v}%"></i></div><small>${v==null ? 'Not recorded' : v+'% success'}</small></div>`; };
  const cards = (+p.red>0 ? '<span class="card-chip r"></span> ' : '') + (+p.yellow>0 ? '<span class="card-chip y"></span>' : '') || '—';
  document.getElementById('modal-root').innerHTML = `
  <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
    <div class="mpc t-${tier.key}" role="dialog" aria-modal="true" aria-label="${esc(p.name)} match card">
      <div class="mpc-in">
        <button class="mpc-x" onclick="closeModal()" aria-label="Close">×</button>
        <div class="mpc-head">
          <div class="mpc-ovr"><b>${ovr}</b><span>OVR</span></div>
          <div class="mpc-id">
            <h4>${esc(p.name)}</h4>
            <p>${esc(posLabel)}, ${esc(own.name)}</p>
            <p>${res} ${os}–${ps} · ${formatDate(m.date)}</p>
          </div>
        </div>
        <div class="mpc-tags">${isMotm?'<span>Man of the match</span>':''}${isCS?'<span>Clean sheet</span>':''}${p.isSub?'<span>Substitute</span>':''}${(+p.ownGoals>0)?`<span class="bad">Own goal ×${p.ownGoals}</span>`:''}</div>
        <div class="mpc-hero"><div><b>${+p.goals||0}</b><span>Goals</span></div><div><b>${+p.assists||0}</b><span>Assists</span></div><div><b>${+p.bigChances||0}</b><span>Big chances created</span></div></div>
        <div class="mpc-mini">
          <div><b>${+p.saves||0}</b><span>Saves</span></div>
          <div><b>${p.minutesPlayed!=null&&p.minutesPlayed!=='' ? p.minutesPlayed : MATCH_DURATION_MINUTES}'</b><span>Played</span></div>
          <div><b>${p.rating!==''&&p.rating!=null ? Number(p.rating).toFixed(1) : '—'}</b><span>Rating</span></div>
          <div><b>${cards}</b><span>Cards</span></div>
        </div>
        <div class="mpc-meters">${meter('Dribbles completed',p.dribComp,p.dribAtt)}${meter('Defensive contribution',p.defComp,p.defAtt)}</div>
        <div class="mpc-foot"><button class="btn" onclick="closeModal()">Close</button><button class="btn primary" onclick="closeModal();navigate('player','${esc(norm)}')">Full profile</button></div>
      </div>
    </div>
  </div>`;
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && document.querySelector('#modal-root .mpc')) closeModal(); });

function scoreboardHTML(m, big){
  const s1 = scoreOf(m.team1, m.team2), s2 = scoreOf(m.team2, m.team1);
  const c1 = s1>s2?'win':s1<s2?'lose':'draw', c2 = s2>s1?'win':s2<s1?'lose':'draw';
  return `<div class="board ${big?'big':''}">
    <div class="board-team"><span class="board-name">${esc(m.team1.name)}</span><span class="kit k1"></span></div>
    <div class="board-score"><b class="${c1}">${s1}</b><i>:</i><b class="${c2}">${s2}</b></div>
    <div class="board-team right"><span class="kit k2"></span><span class="board-name">${esc(m.team2.name)}</span></div>
  </div>`;
}

/* =========================================================
   Render pipeline
========================================================= */
function render(){
  const app = document.getElementById('app');
  let html;
  try{
    html = renderView(CURRENT.view, CURRENT.param);
  }catch(e){
    console.error('render error for view', CURRENT.view, CURRENT.param, e);
    html = `<div class="notice"><h2>Something went wrong showing this page</h2><p>${esc(e.message)}</p><div style="margin-top:20px;"><button class="btn primary" onclick="navigate('home')">Back to home</button></div></div>`;
  }
  const wrap = document.createElement('div');
  wrap.className = 'view';
  wrap.innerHTML = html;
  app.innerHTML = '';
  app.appendChild(wrap);
  renderTopbarRight();
  updateActiveNav();
  refreshPlayersDatalist();
}

function updateActiveNav(){
  document.getElementById('nav-records').classList.toggle('active', CURRENT.view==='records' || CURRENT.view==='match' || CURRENT.view==='addmatch');
  document.getElementById('nav-players').classList.toggle('active', CURRENT.view==='players' || CURRENT.view==='player');
  const st = document.getElementById('nav-stats');
  if(st) st.classList.toggle('active', CURRENT.view==='stats');
}

function renderTopbarRight(){
  const el = document.getElementById('topbar-right');
  if(STATE.admin){
    el.innerHTML = `
      <span class="admin-chip"><span class="dot"></span>${esc(STATE.admin.name)}, admin</span>
      <button class="btn primary small" onclick="navigate('addmatch', CURRENT.param && FORMAT_INFO[CURRENT.param] ? CURRENT.param : '5v5')">New match</button>
      <button class="btn small" onclick="navigate('adminlog')">Login history</button>
      <button class="btn small" onclick="adminLogout()">Log out</button>
    `;
  }else{
    el.innerHTML = `<button class="btn small" onclick="openLoginModal()">Admin login</button>`;
  }
}

function renderView(view, param){
  if(!STATE.loaded){
    return `<div class="loading"><span class="spin"></span><div>Loading official records…</div></div>`;
  }
  if(firebaseInitError){
    return `<div class="notice"><h2>Not connected to the database</h2><p>${esc(firebaseInitError)}</p><p class="fine" style="margin:14px auto 0;">Check the browser console for details, and see the setup steps for connecting your Firebase project.</p></div>`;
  }
  switch(view){
    case 'records': return renderRecords(param);
    case 'match': return renderMatchDetail(param);
    case 'addmatch': return renderAddMatch(param);
    case 'stats': return renderStats(param);
    case 'players': return renderPlayersRegistry();
    case 'player': return renderPlayerProfile(param);
    case 'adminlog': return renderAdminLog();
    case 'license': return renderLicense();
    default: return renderHome();
  }
}

      <div class="honour"><div class="tr">${trophySVG('')}</div><div><div class="comp">League winner, Division 2</div><div class="team">Galacticos FC</div><div class="times">1× champion</div></div></div>
      <div class="honour"><div class="tr">${trophySVG('')}</div><div><div class="comp">FutCL winner</div><div class="team">GG Beetles</div><div class="times">1× champion</div></div></div>

/* ---------- Player cards ---------- */
function renderPlayerCardsSection(prefix, limit){
  // FC Rating always comes from the player's ENTIRE match history, every
  // season combined — ending a season never resets or recalculates it.
  // Only the stat row on each card reflects the current season.
  const allTimeAgg = computeAggregates()
    .map(p=>{ p.rating = cardRating(p); return p; })
    .sort((a,b)=> b.rating-a.rating || a.name.localeCompare(b.name));
  if(allTimeAgg.length===0){
    return `<div class="empty-state"><div class="ic">${icon('id',null,34)}</div><b>No players registered yet</b>Players are added to this directory automatically the first time they appear in a saved match.</div>`;
  }
  const seasonAggMap = new Map(computeAggregates(seasonMatchList(STATE.seasonMeta.current)).map(p=>[normalize(p.name), p]));
  const list = limit ? allTimeAgg.slice(0, limit) : allTimeAgg;
  return `
    ${limit ? '' : `<div class="player-search"><input type="text" id="${prefix}-player-search-input" placeholder="Search registered players" aria-label="Search registered players" oninput="filterPlayerDirectory(this.value,'${prefix}')"></div>`}
    <div class="roster-directory" id="${prefix}-player-directory">
      ${list.map(p=>renderFootballCard(p, seasonAggMap.get(normalize(p.name)))).join('')}
    </div>
    <div id="${prefix}-player-directory-empty" class="empty-state hidden"><div class="ic">${icon('search',null,34)}</div><b>No matches for that search</b>Try a different name.</div>
  `;
}

function ratingTier(r){
  if(r>=85) return { name:'Icon', key:'icon' };
  if(r>=75) return { name:'Gold', key:'gold' };
  if(r>=65) return { name:'Silver', key:'silver' };
  return { name:'Bronze', key:'bronze' };
}

function renderFootballCard(allTimeP, seasonP, opts){
  opts = opts || {};
  // A player with zero appearances this season keeps their card and
  // all-time rating — the stat row just reads 0.
  seasonP = seasonP || { matches:0, goals:0, assists:0, motm:0 };
  const norm = normalize(allTimeP.name);
  const rating = cardRating(allTimeP);
  const tier = ratingTier(rating);
  const pos = getPlayerPosition(norm);
  const positionEditor = (STATE.admin && !opts.noEditor) ? `
    <select aria-label="Set position for ${esc(allTimeP.name)}" onclick="event.stopPropagation()" onchange="setPlayerPosition('${esc(norm)}', this)">
      <option value="">Set position</option>
      ${Object.keys(POSITIONS).map(code=>`<option value="${code}" ${pos===code?'selected':''}>${code}, ${POSITIONS[code].label}</option>`).join('')}
    </select>` : '';
  const attrs = opts.static ? '' : linkAttrs(`navigate('player','${esc(norm)}')`);
  return `
  <div class="pc-slot" data-name="${esc(norm)}">
    <div class="pcard t-${tier.key}" ${attrs}>
      <div class="pc-frame">
        <div class="pc-top">
          <div class="pc-rate">${rating}${ratingBadge(rating)}</div>
          ${pos ? `<div class="pc-pos">${esc(pos)}</div>` : ''}
          <div class="pc-tier">${tier.name}</div>
        </div>
        <div class="pc-mono">${esc(monogram(allTimeP.name))}</div>
        <div class="pc-name">${esc(allTimeP.name)}</div>
        <div class="pc-stats" title="Stats for the selected season">
          <div><b>${seasonP.matches}</b>Played</div>
          <div><b>${seasonP.goals}</b>Goals</div>
          <div><b>${seasonP.assists}</b>Assists</div>
          <div><b>${seasonP.motm}</b>MOTM</div>
        </div>
        ${(allTimeP.bigChances||allTimeP.dribAtt||allTimeP.defAtt) ? `<div class="pc-skill" title="Big chances created (count), dribbling and defending success (all-time)"><span><b>${allTimeP.bigChances||0}</b>BCC</span><span><b>${pctTxt(allTimeP.dribComp,allTimeP.dribAtt)}</b>DRI</span><span><b>${pctTxt(allTimeP.defComp,allTimeP.defAtt)}</b>DEF</span></div>` : ''}
      </div>
    </div>
    ${positionEditor}
  </div>`;
}

function filterPlayerDirectory(q, prefix){
  prefix = prefix || 'full';
  const query = normalize(q);
  const cards = document.querySelectorAll(`#${prefix}-player-directory .pc-slot`);
  let visible = 0;
  cards.forEach(c=>{
    const match = !query || c.dataset.name.includes(query);
    c.style.display = match ? '' : 'none';
    if(match) visible++;
  });
  const emptyBox = document.getElementById(`${prefix}-player-directory-empty`);
  if(emptyBox) emptyBox.classList.toggle('hidden', visible!==0);
}

/* ---------- Match records ---------- */
function renderRecords(fmt){
  if(!FORMAT_INFO[fmt]) fmt = '5v5';
  const info = FORMAT_INFO[fmt];
  const matches = STATE.matches.filter(m=>m.format===fmt).sort(byNewest);
  const tabs = Object.keys(FORMAT_INFO).map(f=>`<button class="${f===fmt?'on':''}" onclick="navigate('records','${f}')">${f.toUpperCase()}</button>`).join('');
  const groups = {};
  matches.forEach(m=>{ const k = m.date || ''; (groups[k] = groups[k] || []).push(m); });
  const dates = Object.keys(groups).sort().reverse();

  return `
  <div class="crumbs"><span onclick="navigate('home')">Home</span> / Match records</div>
  <div class="page-head">
    <div>
      <h1>${fmt.toUpperCase()} match records</h1>
      <div class="desc">${info.label} fixtures, ${info.perSide} against ${info.perSide}. ${matches.length} match${matches.length===1?'':'es'} on file, newest first.</div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
      ${Object.keys(FORMAT_INFO).length > 1 ? `<div class="seg sm">${tabs}</div>` : ''}
      ${(STATE.admin && !info.stopped) ? `<button class="btn primary" onclick="navigate('addmatch','${fmt}')">Log a match</button>` : ''}
    </div>
  </div>

  ${info.stopped ? `
    <div class="match-note"><span class="ic">${icon('block',null,20)}</span><div><div class="nm">${fmt.toUpperCase()} fixtures stopped</div><div class="lbl">No new ${fmt} matches can be registered. Every previously saved ${fmt} match stays archived below.</div></div></div>
  ` : ''}

  ${matches.length === 0 ? `
    <div class="empty-state">
      <div class="ic">${icon('folder',null,34)}</div>
      <b>No ${fmt} matches yet</b>
      ${info.stopped ? '' : (STATE.admin ? 'Log the first fixture to start the archive.' : 'Check back once an admin logs a fixture, or log in to add one.')}
      <div style="margin-top:20px;">
        ${info.stopped ? '' : (STATE.admin ? `<button class="btn primary" onclick="navigate('addmatch','${fmt}')">Log a ${fmt} match</button>` : `<button class="btn" onclick="openLoginModal()">Admin login</button>`)}
      </div>
    </div>
  ` : dates.map(d=>`
    <section class="day">
      <h3 class="day-h">${longDate(d)}</h3>
      <div class="fx-grid">${groups[d].map(m=>renderScorecard(m, false)).join('')}</div>
    </section>
  `).join('')}
  `;
}

function scoreOf(team, oppTeam){
  const own = team.players.reduce((s,p)=>s+(+p.goals||0),0) + (+team.extraGoals||0);
  const conceded = oppTeam ? oppTeam.players.reduce((s,p)=>s+(+p.ownGoals||0),0) : 0;
  return own + conceded;
}

function renderScorecard(m, showDate){
  if(showDate===undefined) showDate = true;
  const s1 = scoreOf(m.team1, m.team2), s2 = scoreOf(m.team2, m.team1);
  const extraTotal = (+m.team1.extraGoals||0) + (+m.team2.extraGoals||0);
  const ogTotal = [...m.team1.players, ...m.team2.players].reduce((s,p)=>s+(+p.ownGoals||0),0);
  return `
  <article class="fx" ${linkAttrs(`navigate('match','${m.id}')`)}>
    <div class="fx-meta"><span>${showDate ? formatDate(m.date) : 'Full time'}</span><span class="chip">${m.format.toUpperCase()}</span></div>
    <div class="fx-main">
      <div class="fx-team"><span class="nm">${esc(m.team1.name)}</span><span class="kit k1"></span></div>
      <div class="fx-score"><span class="${s1<s2?'lose':''}">${s1}</span><u>:</u><span class="${s2<s1?'lose':''}">${s2}</span></div>
      <div class="fx-team right"><span class="kit k2"></span><span class="nm">${esc(m.team2.name)}</span></div>
    </div>
    <div class="fx-foot">
      ${m.motm ? `<span>Man of the match</span><b>${esc(m.motm)}</b>` : `<span>No man of the match named</span>`}
      ${extraTotal>0 ? `<span class="chip warn">${icon('ball',null,12)} +${extraTotal} unregistered</span>` : ''}
      ${ogTotal>0 ? `<span class="chip bad">${icon('warning',null,12)} ${ogTotal} own goal${ogTotal===1?'':'s'}</span>` : ''}
      ${(m.team1.cleanSheet||m.team2.cleanSheet) ? `<span class="chip good">${icon('glove',null,12)} Clean sheet</span>` : ''}
    </div>
  </article>`;
}

/* ---------- Match detail ---------- */

  `;
}

/* ---------- Player profile ---------- */
function renderPlayerProfile(normName){
  // FC Rating (tier, market value) always comes from the player's ENTIRE
  // match history. Everything else follows the chosen season tab.
  const allTimeAgg = computeAggregates();
  const ratingP = allTimeAgg.find(x=>normalize(x.name)===normName);
  if(!ratingP){
    return `<div class="empty-state"><div class="ic">${icon('question',null,34)}</div><b>Player not found</b>They may not be registered yet.<div style="margin-top:18px;"><button class="btn" onclick="navigate('players')">Back to players</button></div></div>`;
  }
  const seasonSel = profileSeasonFilter || 'all';
  const matchList = resolveSeasonMatchList(seasonSel);
  const seasonAgg = computeAggregates(matchList);
  const p = seasonAgg.find(x=>normalize(x.name)===normName) || { name:ratingP.name, goals:0, assists:0, saves:0, yellow:0, red:0, motm:0, matches:0, ratingSum:0, ratingCount:0 };
  const history = getPlayerHistory(normName, matchList);
  const record = history.reduce((r,h)=>{
    if(h.ownScore > h.oppScore) r.wins++;
    else if(h.ownScore < h.oppScore) r.losses++;
    else r.draws++;
    return r;
  }, { wins:0, draws:0, losses:0 });
  const avgRating = p.ratingCount ? (p.ratingSum/p.ratingCount).toFixed(1) : '—';
  const rating = cardRating(ratingP);
  const tier = ratingTier(rating);
  const pos = getPlayerPosition(normName);
  const seasonLabel = seasonSel==='all' ? 'All-time' : seasonSel==='current' ? `Season ${STATE.seasonMeta.current} (current)` : `Season ${seasonSel}`;
  return `
  <div class="crumbs"><span onclick="navigate('home')">Home</span> / <span onclick="navigate('players')">Players</span> / ${esc(ratingP.name)}</div>

  <div class="profile">
    <div class="profile-card">${renderFootballCard(ratingP, p, { static:true, noEditor:true })}</div>
    <div>
      <h1>${esc(ratingP.name)}</h1>
      <div class="tags">
        <span class="chip">Registered player</span>
        <span class="chip">Gardens Football Federation</span>
        ${pos ? `<span class="chip sky">${esc((POSITIONS[pos]&&POSITIONS[pos].label)||pos)}</span>` : ''}
        <span class="chip warn">FC rating ${rating}, ${tier.name}</span>
      </div>
      ${STATE.admin ? `<div class="pos-edit"><select aria-label="Set position" onchange="setPlayerPosition('${esc(normName)}', this).then(()=>navigate('player','${esc(normName)}'))">
        <option value="">Set position</option>
        ${Object.keys(POSITIONS).map(code=>`<option value="${code}" ${pos===code?'selected':''}>${code}, ${POSITIONS[code].label}</option>`).join('')}
      </select></div>` : ''}

      <div class="subsec" style="margin-top:34px;">
        <h2 class="h2">Stats, ${esc(seasonLabel)}</h2>
        ${renderSeasonTabs(seasonSel, 'setProfileSeason', true)}
        <div class="stat-grid">
          <div><b>${p.matches}</b><span>Matches</span></div>
          <div><b>${p.goals}</b><span>Goals</span></div>
          <div><b>${p.assists}</b><span>Assists</span></div>
          <div><b>${p.saves}</b><span>Saves</span></div>
          <div><b>${p.motm}</b><span>Man of the match</span></div>
          <div><b>${p.yellow}</b><span>Yellow cards</span></div>
          <div><b>${p.red}</b><span>Red cards</span></div>
          <div><b>${avgRating}</b><span>Average rating</span></div>
          <div><b>${p.bigChances||0}</b><span>Big chances created</span></div>
          <div><b>${pctTxt(p.dribComp,p.dribAtt)}${p.dribAtt?'%':''}</b><span>Dribbles completed${p.dribAtt?` (${p.dribComp}/${p.dribAtt})`:''}</span></div>
          <div><b>${pctTxt(p.defComp,p.defAtt)}${p.defAtt?'%':''}</b><span>Defensive success${p.defAtt?` (${p.defComp}/${p.defAtt})`:''}</span></div>
          <div><b>${(p.dribComp||0)+(p.defComp||0)}</b><span>Successful actions</span></div>
        </div>
      </div>

      ${renderPlayerDetailsSection(normName, record, ratingP)}
      ${renderTrophySection(normName)}
      ${renderSeasonHighlights(normName, matchList)}

      <div class="subsec">
        <h2 class="h2">Match history, ${esc(seasonLabel)}</h2>
        ${history.length===0 ? `<div class="empty-state" style="margin-left:0;"><div class="ic">${icon('scroll',null,34)}</div><b>No matches in ${esc(seasonLabel)}</b>${seasonSel==='all' ? 'This player hasn’t featured in a saved match yet.' : 'This player didn’t feature during this season.'}</div>` : `
        <div class="history">
          ${history.map(h=>{
            const r = h.ownScore>h.oppScore ? 'w' : h.ownScore<h.oppScore ? 'l' : 'd';
            const isMotm = h.match.motm && normalize(h.match.motm)===normName;
            return `
          <div class="hist-row" ${linkAttrs(`navigate('match','${h.match.id}')`)}>
            <span class="h-date">${formatDate(h.match.date)}</span>
            <span class="h-score"><span class="res ${r}">${r.toUpperCase()}</span>${esc(h.teamName)}<em>${h.ownScore}–${h.oppScore}</em>${esc(h.oppName)}</span>
            <span class="h-stats"><span title="Goals">${icon('ball',null,14)} ${h.stats.goals||0}</span><span title="Assists">${icon('target',null,14)} ${h.stats.assists||0}</span><span title="Saves">${icon('glove',null,14)} ${h.stats.saves||0}</span>${isMotm ? `<span class="chip warn">${icon('trophy2',null,12)} MOTM</span>` : ''}</span>
          </div>`;}).join('')}
        </div>`}
      </div>
    </div>
  </div>
  `;
}

/* One quiet line hinting what still moves this player's rating. */
function ratingFormTip(p){
  const openLevers = [];
  if(p.goals*1.8 < 20) openLevers.push('a goal');
  if(p.assists*1.6 < 12) openLevers.push('an assist');
  if(p.motm*3 < 9) openLevers.push('MOTM');
  const upText = openLevers.length ? openLevers.slice(0,2).join(' or ') : 'a big personal rating';
  return `${icon('trend',null,15)} Next game: ${upText} nudges this up. A card or a poor rating pulls it down.`;
}

function renderPlayerDetailsSection(normName, record, p){
  const pd = getPlayerData(normName);
  const age = calculateAge(pd.birthdate);
  const ageStr = age ? `${age.years} yr${age.years===1?'':'s'} ${age.months} mo` : '—';
  const played = record.wins + record.draws + record.losses;
  const winPct = played ? Math.round((record.wins/played)*100) : 0;
  return `
  <div class="subsec">
    <h2 class="h2">${icon('clipboard',null,24)} Player details</h2>
    <dl class="bio">
      <div class="bio-row"><dt>Birthdate</dt><dd>${STATE.admin ? `<input type="date" value="${esc(pd.birthdate)}" aria-label="Birthdate" onchange="updatePlayerDetail('${esc(normName)}','birthdate',this.value)">` : (pd.birthdate ? formatDate(pd.birthdate) : '—')}</dd></div>
      <div class="bio-row"><dt>Age</dt><dd class="accent">${ageStr}</dd></div>
      <div class="bio-row"><dt>Height</dt><dd>${STATE.admin ? `<input type="number" min="0" step="0.1" value="${esc(pd.height)}" placeholder="cm" aria-label="Height in centimetres" onchange="updatePlayerDetail('${esc(normName)}','height',this.value===''?'':Number(this.value))">` : (pd.height!=='' ? pd.height+' cm' : '—')}</dd></div>
      <div class="bio-row"><dt>Weight</dt><dd>${STATE.admin ? `<input type="number" min="0" step="0.1" value="${esc(pd.weight)}" placeholder="kg" aria-label="Weight in kilograms" onchange="updatePlayerDetail('${esc(normName)}','weight',this.value===''?'':Number(this.value))">` : (pd.weight!=='' ? pd.weight+' kg' : '—')}</dd></div>
      <div class="bio-row"><dt>Record (${winPct}% win rate)</dt><dd class="accent">${record.wins}W ${record.draws}D ${record.losses}L</dd></div>
      <div class="bio-row"><dt>Market value</dt><dd class="accent">${formatMarketValue(calcMarketValue(cardRating(p), age?age.years:null))}</dd></div>
    </dl>
    <div class="form-tip">${ratingFormTip(p)}</div>
    ${STATE.admin ? `<p class="fine">Only admins can set birthdate, height and weight, and they never appear in match registration. Win, draw and loss is calculated from match history. Market value is an estimate from rating and age, with 16 treated as this league’s prime age.</p>` : ''}
  </div>
  `;
}

function renderTrophySection(normName){
  const pd = getPlayerData(normName);
  const keys = Object.keys(TROPHY_DEFS);
  const wonKeys = keys.filter(key => (pd.trophies[key]||0) > 0);
  const visibleKeys = STATE.admin ? keys : wonKeys;
  // Nothing won yet and no admin present: hide the section entirely.
  if(!STATE.admin && wonKeys.length===0) return '';
  return `
  <div class="subsec">
    <h2 class="h2">${icon('trophy2',null,24)} Player achievements</h2>
    <div class="trophy-grid">
      ${visibleKeys.map(key=>{
        const count = pd.trophies[key]||0;
        return `
        <div class="trophy-card ${count>0?'has':''}">
          <div class="trophy-ic">${trophySVG('')}</div>
          <div class="trophy-name">${TROPHY_DEFS[key].label}</div>
          <div class="trophy-count">${count}</div>
          ${STATE.admin ? `
            <div class="trophy-controls">
              <button class="eg-step" aria-label="Remove one ${TROPHY_DEFS[key].label}" onclick="adjustTrophy('${esc(normName)}','${key}',-1)">−</button>
              <button class="eg-step" aria-label="Add one ${TROPHY_DEFS[key].label}" onclick="adjustTrophy('${esc(normName)}','${key}',1)">+</button>
            </div>` : ''}
        </div>`;
      }).join('')}
    </div>
  </div>
  `;
}

function renderSeasonHighlights(normName, matchList){
  const h = getSeasonHighlights(normName, matchList);
  const total = h.hattricks.length + h.assistHats.length + h.cleanSheets.length;
  const row = (ic, title, x)=>`
    <div class="hl" ${linkAttrs(`navigate('match','${x.match.id}')`)}>
      <span class="ic">${icon(ic,null,20)}</span>
      <div><div class="t">${title}</div><div class="m">${formatDate(x.match.date)}, ${esc(x.teamName)} vs ${esc(x.oppName)}</div></div>

  <div class="subsec">
    <h2 class="h2">${icon('star',null,24)} Season highlights</h2>

    <div class="hl-list">

function renderSeasonTabs(selected, onClickFn, includeAllTime){

}

/* ---------- Stats ---------- */
/* ---------- Stats page ---------- */
const STAT_DEFS = {
  topscorers: { title:'Top Scorers', desc:'Ranked by total goals across every recorded match.', field:'goals', unit:'GOALS', cls:'' },
  assists: { title:'Most Assists', desc:'Ranked by total assists laid on across every recorded match.', field:'assists', unit:'ASSISTS', cls:'' },
  goalcontrib: { title:'Goal + Assist', desc:'Ranked by total goal contributions — goals and assists combined.', field:'ga', unit:'G+A', cls:'' },
  bestplayer: { title:'Best Player', desc:'Ranked by season-long impact — presence, goals and assists, and sustained performance across every match, rather than a couple of standout Man of the Match moments.', field:'bpScore', unit:'SEASON IMPACT', cls:'' },
  mostsaves: { title:'Most Saves', desc:'Ranked by total saves recorded — goalkeeping honours.', field:'saves', unit:'SAVES', cls:'' },
  yellow: { title:'Yellow Cards', desc:'Ranked by total yellow cards received.', field:'yellow', unit:'YELLOWS', cls:'yellow' },
  red: { title:'Red Cards', desc:'Ranked by total red cards received.', field:'red', unit:'REDS', cls:'red' },
};

function renderStats(kind){
  if(!STAT_DEFS[kind]) kind='topscorers';
  const def = STAT_DEFS[kind];
  const seasonSel = statsSeasonFilter || 'current';
  const matchList = resolveSeasonMatchList(seasonSel);
  let agg = computeAggregates(matchList);
  if(kind==='bestplayer'){
    agg = agg.map(p=>{ p.bpScore = bestPlayerScore(p); return p; }).filter(p=>p.bpScore > 0);
    agg.sort((a,b)=> b.bpScore-a.bpScore || (b.goals+b.assists)-(a.goals+a.assists) || b.matches-a.matches);
    agg = agg.slice(0, 10);
  }else{
    agg = agg.filter(p=>p[def.field] > 0);
    agg.sort((a,b)=> b[def.field]-a[def.field]);
  }
  const isBP = kind==='bestplayer';
  const valOf = p => isBP ? Math.round(p.bpScore) : p[def.field];
  const max = agg.length ? valOf(agg[0]) : 0;
  const unitLabel = ({ 'G+A':'goals plus assists', 'SEASON IMPACT':'season impact' })[def.unit] || def.unit.toLowerCase();

  const tabs = Object.keys(STAT_DEFS).map(k=>`<button class="${k===kind?'on':''}" onclick="navigate('stats','${k}')">${STAT_DEFS[k].title}</button>`).join('');
  const seasonLabel = seasonSel==='current' ? `Season ${STATE.seasonMeta.current} (current)` : seasonSel==='all' ? 'All-time' : `Season ${seasonSel}`;

  const COLS = [
    {k:'matches', h:'Played'}, {k:'goals', h:'Goals'}, {k:'assists', h:'Assists'}, {k:'ga', h:'G+A'},
    {k:'motm', h:'MOTM'}, {k:'saves', h:'Saves'}, {k:'yellow', h:'Yellow'}, {k:'red', h:'Red'}
  ];
  const activeKey = isBP ? 'impact' : def.field;
  const barCell = (v)=>{
    const pct = max>0 ? Math.max(8, Math.round(v/max*100)) : 0;
    return `<td class="act"><span class="bar" style="--w:${pct}%"></span><b>${v}</b></td>`;
  };

  return `
  <div class="crumbs"><span onclick="navigate('home')">Home</span> / Stats / ${def.title}</div>
  <div class="page-head">
    <div><h1>${def.title}</h1><div class="desc">${def.desc}${isBP ? ' Top 10 shown.' : ''} Showing ${esc(seasonLabel)}.</div></div>
    ${agg.length ? `<div class="leader"><div class="u">Leading</div><div class="nm">${esc(agg[0].name)}</div><div class="v">${valOf(agg[0])}</div><div class="u">${unitLabel}</div></div>` : ''}
  </div>
  <div class="stat-filters">
    <div class="seg">${tabs}</div>
    ${renderSeasonTabs(seasonSel, 'setStatsSeason', true).replace('style="margin-top:14px;"','style="margin:0;"')}
  </div>

  ${agg.length===0 ? `<div class="empty-state"><div class="ic">${icon('chart',null,34)}</div><b>No data yet for ${esc(seasonLabel)}</b>This leaderboard fills in once matches in this season record ${isBP ? 'enough appearances and contributions' : def.unit.toLowerCase()}.</div>` : `
    <div class="lt-wrap">
    <table class="lt">
      <thead>
        <tr>
          <th class="c-rank">#</th>
          <th class="c-player">Player</th>
          <th>Pos</th>
          ${COLS.map(c=>`<th class="${c.k===activeKey?'act':''}">${c.h}</th>`).join('')}
          <th>Rating</th>
          ${isBP ? '' : '<th>Per game</th>'}
          ${isBP ? '<th class="act">Impact</th>' : ''}
        </tr>
      </thead>
      <tbody>
        ${agg.map((p,i)=>{
          const norm = normalize(p.name);
          const posCode = getPlayerPosition(norm);
          const avgR = p.ratingCount ? (p.ratingSum/p.ratingCount).toFixed(1) : '—';
          const perGame = (!isBP && p.matches) ? (p[def.field]/p.matches).toFixed(2) : '—';
          return `
        <tr class="${i===0?'top1':''}">
          <td class="c-rank">${i<3 ? `<span class="medal m${i+1}">${i+1}</span>` : `<span class="dim">${i+1}</span>`}</td>
          <td class="c-player"><div class="pl" ${linkAttrs(`navigate('player','${esc(norm)}')`)}><span class="mono">${esc(monogram(p.name))}</span><span class="pn">${esc(p.name)}</span></div></td>
          <td><span class="pos-tag">${posCode ? esc(posCode) : '—'}</span></td>
          ${COLS.map(c=> c.k===activeKey ? barCell(p[c.k]) : `<td class="${c.k==='matches'?'dim':''}">${p[c.k]}</td>`).join('')}
          <td>${avgR}</td>
          ${isBP ? '' : `<td class="dim">${perGame}</td>`}
          ${isBP ? barCell(Math.round(p.bpScore)) : ''}
        </tr>`;}).join('')}
      </tbody>
    </table>
    </div>
  `}
  `;
}

/* ---------- Season end (admin) ---------- */
function openEndSeasonModal(){
  if(!STATE.admin) return;
  const root = document.getElementById('modal-root');
  root.innerHTML = `
  <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <h3>End Season ${STATE.seasonMeta.current}</h3>
      <p class="hint">Enter when Season ${STATE.seasonMeta.current} ran. This only labels the season for the record — every match already saved stays exactly where it is. Once confirmed, Season ${STATE.seasonMeta.current+1} begins immediately: leaderboards and player-card stat rows reset to zero, but Season ${STATE.seasonMeta.current} remains fully browsable, and no player's FC Rating changes.</p>
      <div class="field"><label>Season started</label><input id="season-start-date" type="date"></div>
      <div class="field"><label>Season ended</label><input id="season-end-date" type="date"></div>
      <div id="season-end-err"></div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn primary" onclick="submitEndSeason()">End Season ${STATE.seasonMeta.current}</button>
      </div>
    </div>
  </div>`;
  setTimeout(()=>{ const el = document.getElementById('season-start-date'); if(el) el.focus(); }, 60);
}

async function submitEndSeason(){
  if(!STATE.admin) return;
  const errBox = document.getElementById('season-end-err');
  const start = document.getElementById('season-start-date').value;
  const end = document.getElementById('season-end-date').value;
  if(!start || !end){ errBox.innerHTML = `<div class="err-text">Enter both a start and an end date.</div>`; return; }
  if(end < start){ errBox.innerHTML = `<div class="err-text">The end date can't be before the start date.</div>`; return; }
  const endingNumber = STATE.seasonMeta.current;
  if(!confirm(`End Season ${endingNumber} and start Season ${endingNumber+1}? Leaderboards and player-card stats reset to zero for the new season. Season ${endingNumber} stays fully accessible. This cannot be undone.`)) return;

  const backup = JSON.parse(JSON.stringify(STATE.seasonMeta));
  STATE.seasonMeta.history.push({ number: endingNumber, startDate: start, endDate: end, endedAt: Date.now() });
  STATE.seasonMeta.current = endingNumber + 1;
  const ok = await saveSeasonMeta();
  if(ok){
    showToast(`Season ${endingNumber} ended. Season ${STATE.seasonMeta.current} is now underway.`);
    closeModal();
    navigate('adminlog');
  }else{
    STATE.seasonMeta = backup;
  }
}

/* Per-player fields added to every row: the position played in THIS match,
   plus big chances created (a plain count) and completed / attempted for dribbles and defensive actions. */
function skillFieldsHTML(){
  const pair = (role,label,title)=>`<div class="pair-wrap"><span class="mini-lbl" title="${title}">${label}</span><div class="pair"><input data-role="${role}-c" type="number" min="0" value="0" aria-label="${title}, completed"><em>/</em><input data-role="${role}-a" type="number" min="0" value="0" aria-label="${title}, attempts"></div></div>`;
  return `<div class="pos-wrap"><span class="mini-lbl">Position</span><select data-role="pos" aria-label="Position played in this match"><option value="">Auto</option>${Object.keys(POSITIONS).map(c=>`<option value="${c}">${c}, ${POSITIONS[c].label}</option>`).join('')}</select></div>`
    + pair('drib','Dribbles','Dribbles completed out of attempted')
    + `<div class="bc-wrap"><span class="mini-lbl" title="Big chances this player created for teammates">Big chances</span><input data-role="bigchances" type="number" min="0" value="0" aria-label="Big chances created"></div>`
    + pair('def','Defending','Defensive contributions out of attempts (tackles, blocks, interceptions)');
}
function readExtras(row){
  const n = r => Number(row.querySelector(`[data-role="${r}"]`).value)||0;
  const o = { pos: row.querySelector('[data-role="pos"]').value || '' };
  ['drib','def'].forEach(k=>{ const c = n(k+'-c'); o[k+'Comp'] = c; o[k+'Att'] = Math.max(c, n(k+'-a')); });
  o.bigChances = Math.max(0, Math.floor(n('bigchances')));
  return o;
}

function onNameInput(el){
  const row = el.closest('.player-row');
  const team = row.dataset.team, idx = row.dataset.idx;
  const slot = document.querySelector(`[data-suggest-for="${team}-${idx}"]`);
  const registry = getAllPlayerNames();
  const val = el.value;
  if(!val.trim()){ slot.innerHTML=''; refreshCleanSheetPlayers(team); return; }
  const result = findCanonical(val, registry);
  if(result.exact && normalize(result.exact) !== normalize(val)){
    // silently correct casing/spacing to match official record
    el.value = result.exact;
    slot.innerHTML = `<div class="suggest-line">✓ Matched to existing player <b>${esc(result.exact)}</b></div>`;
  } else if(result.exact){
    slot.innerHTML = `<div class="suggest-line">✓ Recognised player <b>${esc(result.exact)}</b></div>`;
  } else if(result.suggestion){
    slot.innerHTML = `<div class="suggest-line" onclick="applySuggestion(this)" data-name="${esc(result.suggestion)}">Did you mean <b>${esc(result.suggestion)}</b>? Click to use.</div>`;
  } else {
    slot.innerHTML = `<div class="suggest-line" style="color:var(--muted);">New player — will be permanently registered on save.</div>`;
  }
  refreshCleanSheetPlayers(team);
}
function applySuggestion(el){
  const name = el.getAttribute('data-name');
  const container = el.parentElement.previousElementSibling; // the .player-row sits right before the suggest slot
  const input = container.querySelector('input[data-role="name"]');
  input.value = name;
  el.innerHTML = `✓ Matched to existing player <b>${esc(name)}</b>`;
  refreshCleanSheetPlayers(container.dataset.team);
}

function stepExtraGoal(team, delta){
  const input = document.querySelector(`.extra-goal-box[data-team="${team}"] input[data-role="extra-goals"]`);
  if(!input) return;
  const next = Math.max(0, (Number(input.value)||0) + delta);
  input.value = next;
}

    </div>
    <div class="suggest-slot" data-suggest-for="${team}-sub-${idx}"></div>
  `;

function stepSubCount(team, delta){
  const box = document.querySelector(`.subs-box[data-team="${team}"]`);
  if(!box) return;
  const countInput = box.querySelector('input[data-role="sub-count"]');
  const rowsContainer = document.getElementById(`subs-rows-${team}`);
  let count = Math.max(0, Math.min(5, (Number(countInput.value)||0) + delta));

  // preserve any values already entered before rebuilding the row list
  const existingRows = [...rowsContainer.querySelectorAll('.player-row')];
  const existingData = existingRows.map(r=>SUB_KEEP.reduce((o,role)=>{
    o[role] = r.querySelector(`[data-role="${role}"]`).value; return o;
  },{}));

  countInput.value = count;
  rowsContainer.innerHTML = Array.from({length:count}).map((_,i)=>subPlayerRowHTML(team,i)).join('');
  [...rowsContainer.querySelectorAll('.player-row')].forEach((r,i)=>{
    if(!existingData[i]) return;
    SUB_KEEP.forEach(role=>{
      r.querySelector(`[data-role="${role}"]`).value = existingData[i][role];
    });
  });
  refreshCleanSheetPlayers(team);
}

function collectSubPlayers(team, count){
  const players = [];
  for(let i=0;i<count;i++){
    const row = document.querySelector(`.player-row[data-team="${team}"][data-sub="true"][data-idx="sub-${i}"]`);
    if(!row) continue;
    const name = row.querySelector('input[data-role="name"]').value.trim();
    if(!name) continue; // substitute slots are optional — skip empty ones silently
    players.push({
      name,
      goals: Number(row.querySelector('input[data-role="goals"]').value)||0,
      ownGoals: Number(row.querySelector('input[data-role="own-goals"]').value)||0,
      assists: Number(row.querySelector('input[data-role="assists"]').value)||0,
      saves: Number(row.querySelector('input[data-role="saves"]').value)||0,
      yellow: Number(row.querySelector('input[data-role="yellow"]').value)||0,
      red: Number(row.querySelector('input[data-role="red"]').value)||0,
      rating: row.querySelector('input[data-role="rating"]').value === '' ? null : Number(row.querySelector('input[data-role="rating"]').value),
      minutesPlayed: Number(row.querySelector('input[data-role="minutes"]').value)||0,
      ...readExtras(row),
      isSub: true
    });
  }
  return players;
}

/* ---------- Clean sheet credit (any format) ---------- */
function toggleCleanSheet(team, checkbox){
  const wrap = document.getElementById(`cs-players-${team}`);
  if(!wrap) return;
  if(!checkbox.checked){ wrap.classList.add('hidden'); wrap.innerHTML=''; return; }
  wrap.classList.remove('hidden');
  refreshCleanSheetPlayers(team);
}

function refreshCleanSheetPlayers(team){
  const wrap = document.getElementById(`cs-players-${team}`);
  if(!wrap || wrap.classList.contains('hidden')) return;
  const names = [...document.querySelectorAll(`.player-row[data-team="${team}"] input[data-role="name"]`)]
    .map(i=>i.value.trim()).filter(Boolean);
  const existingChecked = new Set([...wrap.querySelectorAll('input[type="checkbox"]:checked')].map(c=>c.value));
  wrap.innerHTML = names.length
    ? `<div class="cs-hint">Select the players credited for the clean sheet:</div>` + names.map(n=>`
        <label class="cs-player-chip"><input type="checkbox" value="${esc(n)}" ${existingChecked.has(n)?'checked':''}> ${esc(n)}</label>
      `).join('')
    : `<div class="cs-hint">Enter player names above first.</div>`;
}

function shuffleTeams(fmt){
  const info = FORMAT_INFO[fmt];
  const rows = [...document.querySelectorAll('.player-row:not([data-sub="true"])')];
  const names = rows.map(r=>r.querySelector('input[data-role="name"]').value.trim()).filter(Boolean);
  if(names.length < 2){ showToast('Enter at least a couple of names first.'); return; }
  for(let i=names.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [names[i],names[j]] = [names[j],names[i]];
  }
  rows.forEach((r,i)=>{
    const input = r.querySelector('input[data-role="name"]');
    input.value = names[i] || '';
    ['goals','own-goals','assists','saves','yellow','red','drib-c','drib-a','bigchances','def-c','def-a'].forEach(role=>{ r.querySelector(`[data-role="${role}"]`).value = 0; });
    r.querySelector('[data-role="pos"]').value = '';
    r.querySelector('input[data-role="rating"]').value = '';
    const minutesInput = r.querySelector('input[data-role="minutes"]');
    if(minutesInput) minutesInput.value = 60;
    onNameInput(input);
  });
  showToast('Teams randomized. Stats reset for the new lineup.');
}

function collectTeamPlayers(team, count){
  const players = [];
  for(let i=0;i<count;i++){
    const row = document.querySelector(`.player-row[data-team="${team}"][data-idx="${i}"]`);
    const name = row.querySelector('input[data-role="name"]').value.trim();
    if(!name) return null;
    players.push({
      name,
      goals: Number(row.querySelector('input[data-role="goals"]').value)||0,
      ownGoals: Number(row.querySelector('input[data-role="own-goals"]').value)||0,
      assists: Number(row.querySelector('input[data-role="assists"]').value)||0,
      saves: Number(row.querySelector('input[data-role="saves"]').value)||0,
      yellow: Number(row.querySelector('input[data-role="yellow"]').value)||0,
      red: Number(row.querySelector('input[data-role="red"]').value)||0,
      rating: row.querySelector('input[data-role="rating"]').value === '' ? null : Number(row.querySelector('input[data-role="rating"]').value),
      minutesPlayed: Number(row.querySelector('input[data-role="minutes"]').value)||0,
      ...readExtras(row)
    });
  }
  return players;
}

async function submitMatch(fmt){
  if(!STATE.admin) return;
  const info = FORMAT_INFO[fmt];
  if(info.stopped){ showToast(`${fmt.toUpperCase()} registration is stopped.`); return; }
  const errBox = document.getElementById('mf-err');
  const date = document.getElementById('mf-date').value;
  if(!date){ errBox.innerHTML = `<div class="err-text">Pick a match date.</div>`; return; }

  const t1 = collectTeamPlayers('t1', info.perSide);
  const t2 = collectTeamPlayers('t2', info.perSide);
  if(!t1 || !t2){ errBox.innerHTML = `<div class="err-text">All ${info.total} player names are required (${info.perSide} per side).</div>`; return; }

  // 5v5 substitutes (optional) — merged into each team's player list, tagged isSub
  const sub1Count = fmt==='5v5' ? Number((document.querySelector('.subs-box[data-team="t1"] input[data-role="sub-count"]')||{}).value)||0 : 0;
  const sub2Count = fmt==='5v5' ? Number((document.querySelector('.subs-box[data-team="t2"] input[data-role="sub-count"]')||{}).value)||0 : 0;
  const subs1 = collectSubPlayers('t1', sub1Count);
  const subs2 = collectSubPlayers('t2', sub2Count);
  const allT1 = t1.concat(subs1);
  const allT2 = t2.concat(subs2);

  // resolve names against registry for consistent canonical casing
  const registry = getAllPlayerNames();
  [...allT1, ...allT2].forEach(p=>{
    const r = findCanonical(p.name, registry);
    if(r.exact) p.name = r.exact;
    else registry.set(normalize(p.name), p.name);
  });

  const motmRaw = document.getElementById('mf-motm').value.trim();
  let motm = motmRaw;
  if(motmRaw){
    const r = findCanonical(motmRaw, registry);
    if(r.exact) motm = r.exact;
  }

  const eg1 = Number(document.querySelector('.extra-goal-box[data-team="t1"] input[data-role="extra-goals"]').value) || 0;
  const eg2 = Number(document.querySelector('.extra-goal-box[data-team="t2"] input[data-role="extra-goals"]').value) || 0;

  const cs1Toggle = document.querySelector('.cs-box[data-team="t1"] .cs-toggle-input');
  const cs2Toggle = document.querySelector('.cs-box[data-team="t2"] .cs-toggle-input');
  const cs1 = cs1Toggle ? cs1Toggle.checked : false;
  const cs2 = cs2Toggle ? cs2Toggle.checked : false;
  const cs1Players = cs1 ? [...document.querySelectorAll(`#cs-players-t1 input[type="checkbox"]:checked`)].map(c=>c.value) : [];
  const cs2Players = cs2 ? [...document.querySelectorAll(`#cs-players-t2 input[type="checkbox"]:checked`)].map(c=>c.value) : [];

  const match = {
    id: uid(),
    format: fmt,
    date,
    createdAt: Date.now(),
    season: STATE.seasonMeta.current,
    team1: { name:'Team 1', players:allT1, extraGoals:eg1, cleanSheet:cs1, cleanSheetPlayers:cs1Players },
    team2: { name:'Team 2', players:allT2, extraGoals:eg2, cleanSheet:cs2, cleanSheetPlayers:cs2Players },
    motm: motm || null,
    loggedBy: STATE.admin.name
  };

  errBox.innerHTML = `<div style="display:flex;align-items:center;gap:8px;color:var(--muted);font-family:var(--mono);font-size:12px;"><span class="spin"></span> Saving to official archive…</div>`;
  STATE.matches.push(match);
  const ok = await saveMatches();
  if(ok){
    showToast('Match saved to the official archive.');
    navigate('match', match.id);
  }else{
    STATE.matches.pop();
  }
}

async function deleteMatch(id){
  if(!STATE.admin) return;
  if(!confirm('Remove this match from the official archive? This cannot be undone.')) return;
  const fmt = (STATE.matches.find(m=>m.id===id)||{}).format || '5v5';
  STATE.matches = STATE.matches.filter(m=>m.id!==id);
  await saveMatches();
  showToast('Match removed from the archive.');
  navigate('records', fmt);
}

/* =========================================================
   Toast
========================================================= */
let toastTimer=null;
function showToast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 3200);
}

/* =========================================================
   Init
========================================================= */
(function init(){
  render(); // loading state
  startRealtimeSync(); // attaches live listeners; each one calls render() itself once data (or an error) arrives, and again on every future change from any visitor
})();
</script>
